    function renderCustomerListOnly() {
      const container = document.getElementById('customer-list-container');
      const countEl = document.getElementById('customer-count');
      const shop = getActiveShop();
      if (!container || !shop) return;

      const query = (currentSearchQuery || '').trim().toLowerCase();

      // Filter customers
      let list = shop.customers.filter(c => {
        if (!query) return true;
        const nameMatch = c.name && c.name.toLowerCase().includes(query);
        const phoneMatch = c.phone && c.phone.toLowerCase().includes(query);
        return nameMatch || phoneMatch;
      });

      // Sort by highest balance first (descending balance)
      list.sort((a, b) => {
        const balA = getCustomerBalance(a.id);
        const balB = getCustomerBalance(b.id);
        if (balB !== balA) {
          return balB - balA;
        }
        return (a.name || '').localeCompare(b.name || '');
      });

      if (countEl) {
        countEl.textContent = `${list.length} জন গ্রাহক`;
      }

      if (list.length === 0) {
        if (shop.customers.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">👥</div>
              <div>এখনও কোনো গ্রাহক যোগ করা হয়নি।</div>
              <div class="help-text mt-2">উপরের ফর্ম থেকে আপনার প্রথম গ্রাহক যোগ করুন।</div>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🔍</div>
              <div>এই নামে কোনো গ্রাহক পাওয়া যায়নি।</div>
            </div>
          `;
        }
        return;
      }

      let html = '<ul class="customer-list">';
      for (const c of list) {
        const bal = getCustomerBalance(c.id);
        const dueInfo = bal > 0 ? getCustomerDueInfo(shop, c.id) : null;
        const overdueBadge = (dueInfo && dueInfo.overdue > 0) ? '<div><span class="due-chip over">⏰ মেয়াদ পেরিয়েছে</span></div>' : '';
        let valClass = 'val-settled';
        let statusBadge = '<span style="font-size: 11px; color: var(--text-muted);">পরিশোধিত</span>';
        if (bal > 0) {
          valClass = 'val-baki';
          statusBadge = '<span class="badge-baki">বাকি</span>';
        } else if (bal < 0) {
          valClass = 'val-joma';
          statusBadge = '<span class="badge-joma">অগ্রিম জমা</span>';
        }

        html += `
          <li>
            <a href="#/c/${c.id}" class="customer-item">
              <div class="customer-info">
                <div class="customer-name">${escapeHtml(c.name)}</div>
                <div class="customer-phone">${c.phone ? '📞 ' + escapeHtml(c.phone) : 'নম্বর নেই'}${(() => { const n = getCustomerPurchases(shop, c.id).length; return n ? ` • 🛍️ ${n}টি বিল` : ''; })()}</div>
              </div>
              <div class="customer-balance-box">
                <div class="customer-balance-val ${valClass}">${formatMoney(bal)}</div>
                <div>${statusBadge}</div>
                ${overdueBadge}
              </div>
            </a>
          </li>
        `;
      }
      html += '</ul>';
      container.innerHTML = html;
    }

    function showCloseShiftModal() {
      const shop = getActiveShop();
      const shift = shop.currentShift;
      if (!shift) return;

      const openTime = new Date(shift.openedAt).getTime();
      const closeTime = new Date();

      let shiftCashIn = 0;
      let shiftCreditGiven = 0;
      let shiftExpenses = 0;

      for (const e of shop.entries) {
        const t = new Date(e.at).getTime();
        if (t >= openTime) {
          if (e.kind === 'baki') shiftCreditGiven += e.a;
          else if (e.kind === 'joma' && payModeKey(e.mode) === 'cash') shiftCashIn += e.a;
        }
      }
      shiftCashIn += normalBillCashSince(shop, openTime);
      const shiftDigital = digitalCollectedSince(shop, openTime);
      for (const exp of shop.expenses) {
        const t = new Date(exp.at).getTime();
        if (t >= openTime) shiftExpenses += exp.a;
      }

      const expectedDrawerCash = (shift.openingCash || 0) + shiftCashIn - shiftExpenses;

      const modalHtml = `
        <div class="modal-box">
          <div class="modal-box-header">
            <div class="modal-box-title">🔴 দিনের সমাপ্তি রিপোর্ট (Day End Closing)</div>
            <button type="button" onclick="closeModal()" style="background: none; border: none; font-size: 18px; cursor: pointer;">✕</button>
          </div>
          <div class="modal-box-body">
            <div style="background: var(--bg); padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px;">
              <div>🏪 <strong>${escapeHtml(shop.name)}</strong></div>
              <div class="help-text">⏱️ চালু ছিল: ${formatDateBn(shift.openedAt)} থেকে ${formatDateBn(closeTime)} পর্যন্ত</div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px;">
              <div style="display: flex; justify-content: space-between;">
                <span>সকালের ক্যাশ (Opening):</span>
                <strong>${formatMoney(shift.openingCash)}</strong>
              </div>
              <div style="display: flex; justify-content: space-between; color: var(--primary);">
                <span>(+) আজ নগদ জমা পেলেন:</span>
                <strong>+${formatMoney(shiftCashIn)}</strong>
              </div>
              <div style="display: flex; justify-content: space-between; color: var(--danger);">
                <span>(—) আজ দোকানের খরচ:</span>
                <strong>-${formatMoney(shiftExpenses)}</strong>
              </div>
              <hr style="border: none; border-top: 1px dashed var(--border);">
              <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; color: #0b6e4f;">
                <span>💰 ক্যাশবাক্সে প্রত্যাশিত ক্যাশ:</span>
                <span>${formatMoney(expectedDrawerCash)}</span>
              </div>
              <hr style="border: none; border-top: 1px dashed var(--border);">
              ${shiftDigital > 0 ? `<div style="display: flex; justify-content: space-between; color: var(--info);"><span>📱💳 আজ UPI / কার্ডে পেলেন (ক্যাশবাক্সের বাইরে):</span><strong>${formatMoney(shiftDigital)}</strong></div>` : ''}
              <div style="display: flex; justify-content: space-between; color: var(--danger);">
                <span>📋 আজ নতুন বাকি দেওয়া হয়েছে:</span>
                <strong>${formatMoney(shiftCreditGiven)}</strong>
              </div>
            </div>

            <div class="btn-row mt-3">
              <button type="button" class="btn btn-outline" id="btn-print-shift-summary">🖨️ প্রিন্ট / PDF</button>
              <button type="button" class="btn btn-primary" id="btn-confirm-close-shift">হিসাব মিলিয়ে দিন বন্ধ করুন</button>
            </div>
          </div>
        </div>
      `;

      openModal(modalHtml);

      document.getElementById('btn-confirm-close-shift').onclick = function() {
        if (confirm('আপনি কি নিশ্চিত আজকের দিনের হিসাব ক্লোজ ও সংরক্ষণ করতে চান?')) {
          shop.shifts.push({
            id: Date.now(),
            openedAt: shift.openedAt,
            closedAt: closeTime.toISOString(),
            openingCash: shift.openingCash || 0,
            cashIn: shiftCashIn,
            digitalIn: shiftDigital,
            creditGiven: shiftCreditGiven,
            expenses: shiftExpenses,
            expectedDrawerCash: expectedDrawerCash
          });
          shop.currentShift = null;
          if (saveData()) {
            alert('আজকের দিনের খতিয়ান সফলভাবে সংরক্ষিত হয়েছে!');
            closeModal();
            renderHomeView();
          }
        }
      };

      document.getElementById('btn-print-shift-summary').onclick = function() {
        window.print();
      };
    }

            <!-- Itemized Table Section -->

                    <tr>

                      <th style="width: 75px;">পরিমাণ</th>

                  </thead>

              ${isJewellery ? `
                <div class="form-group" style="background: #fffbeb; padding: 8px; border-radius: 6px; border: 1px solid #fef3c7;">

                <input type="number" step="0.01" min="0.01" id="entry-amount" placeholder="০.০০" ${kind === 'joma' ? 'required autofocus' : ''}>
              </div>
              ${kind === 'joma' ? payModeSelectHtml('pm-single', 'কীভাবে টাকা পেলেন? (নগদ / UPI / কার্ড)') : ''}

            ${kind === 'baki' ? `

                <button type="button" class="sug-pill" data-dueadd="30">৩০ দিন</button>
                <button type="button" class="sug-pill" data-dueadd="0">তারিখ মুছুন</button>
              </div>
              <div class="help-text">তারিখ পেরোলে হোমে "তাগাদার তালিকা"-য় দেখা যাবে।</div>

              <button type="submit" class="btn ${kind === 'baki' ? 'btn-baki' : 'btn-joma'}">সংরক্ষণ করুন</button>

      document.getElementById('btn-cancel-entry-2').onclick = closeForm;

      // Toggle itemized vs quick amount
      const tabItemized = document.getElementById('tab-itemized');
      const tabQuick = document.getElementById('tab-quick-amt');

      const singleAmtSec = document.getElementById('single-amt-section');

      if (tabItemized && tabQuick) {
        tabItemized.onclick = () => {
          isItemizedMode = true;

          isItemizedMode = false;
          tabQuick.classList.add('active');

          itemizedSec.style.display = 'none';
          singleAmtSec.style.display = 'block';
          document.getElementById('suggestions-wrap').style.display = 'none';
          amtInput.focus();
        };
      }

      // Add item row helper
      function addItemRow(initialName = '', initialQty = '1', initialRate = '') {
        rowCounter++;
        const tbody = document.getElementById('items-tbody');
        const tr = document.createElement('tr');
        tr.className = 'bill-item-row';
        tr.id = `row-${rowCounter}`;

        tr.innerHTML = `
          <td>
            <input type="text" class="item-name" placeholder="পণ্য" value="${escapeHtml(initialName)}" required>
          </td>
          ${isJewellery ? `
            <td>
              <select class="item-purity">
                <option value="22K সোনা">২২K সোনা</option>
                <option value="18K সোনা">১৮K সোনা</option>
                <option value="রূপো">রূপো</option>
              </select>
            </td>
          ` : ''}
          <td>
            <input type="number" step="0.001" min="0.001" class="item-qty" placeholder="পরিমাণ" value="${initialQty}" required>
          </td>
          <td>
            <select class="item-unit">
              ${cat.units.map(u => `<option value="${u}">${u}</option>`).join('')}
            </select>
          </td>
          <td>
            <input type="number" step="0.01" min="0" class="item-rate" placeholder="দর" value="${initialRate}" required>
          </td>
          ${isJewellery ? `
            <td>
              <input type="number" step="0.01" min="0" class="item-making" placeholder="মজুরি" value="0.00">
            </td>
          ` : ''}
          <td>
            <input type="number" step="0.01" class="item-total" placeholder="মোট" readonly style="background: #f8f9fa;">
          </td>
          <td>
            <button type="button" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px;" onclick="this.closest('tr').remove(); calculateFormTotals();">✕</button>
          </td>
        `;

        tbody.appendChild(tr);
        attachStockAutofill(tr, shop);

        // Attach auto calculate listener
        const updateLine = () => {
          const qty = parseFloat(tr.querySelector('.item-qty').value) || 0;
          const rate = parseFloat(tr.querySelector('.item-rate').value) || 0;
          const making = isJewellery ? (parseFloat(tr.querySelector('.item-making').value) || 0) : 0;
          const lineTotal = (qty * rate) + making;
          tr.querySelector('.item-total').value = lineTotal.toFixed(2);
        };

        tr.querySelector('.item-qty').addEventListener('input', updateLine);
        tr.querySelector('.item-rate').addEventListener('input', updateLine);
        if (isJewellery) {
          tr.querySelector('.item-making').addEventListener('input', updateLine);
        }
        updateLine();
      }

      window.handlePillClick = function(itemName) {
        if (!isItemizedMode) {
          document.getElementById('entry-note').value = itemName;
          return;

        addItemRow(itemName);
      };

      document.getElementById('btn-add-item-row').onclick = () => addItemRow();
      container.querySelectorAll('[data-dueadd]').forEach(b => {
        b.onclick = () => {
          const n = Number(b.getAttribute('data-dueadd'));
          document.getElementById('entry-due').value = n ? addDaysStr(n) : '';
        };
      });

      // Start with 1 row in itemized mode
      if (isItemizedMode) {
        addItemRow();
      }

      // Form Submit
      document.getElementById('add-entry-form').onsubmit = function(e) {
        e.preventDefault();

        let finalPaise = 0;
        let billData = null;
        const noteVal = document.getElementById('entry-note').value.trim();

        if (isItemizedMode) {
          const rows = document.querySelectorAll('.bill-item-row');
          if (rows.length === 0) {
            alert('অন্তত একটি আইটেম যোগ করুন!');
            return;
          }

          const items = [];
          let grandTotalRupees = 0;

          for (const row of rows) {
            const name = row.querySelector('.item-name').value.trim();
            const qty = parseFloat(row.querySelector('.item-qty').value);
            const unit = row.querySelector('.item-unit').value;
            const rate = parseFloat(row.querySelector('.item-rate').value);
            const purity = isJewellery ? row.querySelector('.item-purity').value : '';
            const making = isJewellery ? (parseFloat(row.querySelector('.item-making').value) || 0) : 0;

            if (!name || isNaN(qty) || qty <= 0 || isNaN(rate) || rate < 0) {
              alert('অনুগ্রহ করে প্রতিটি আইটেমের নাম, সঠিক পরিমাণ ও দর পূরণ করুন!');
              return;
            }

            const lineTotal = (qty * rate) + making;
            grandTotalRupees += lineTotal;

            items.push({
              name,
              qty,
              unit,
              rate,
              purity,
              making,
              lineTotal
            });
          }

          // Deductions & Payments
          const oldGoldDeduction = isJewellery ? (parseFloat(document.getElementById('old-gold-amt').value) || 0) : 0;
          const cashPaidNow = parseFloat(document.getElementById('cash-paid-now').value) || 0;

          const netBillRupees = Math.max(0, grandTotalRupees - oldGoldDeduction);
          const dueRupees = netBillRupees - cashPaidNow;

          if (dueRupees <= 0 && cashPaidNow >= netBillRupees) {
            alert('গ্রাহক সম্পূর্ণ টাকা নগদ পরিশোধ করেছেন। বাকি শূন্য (০.০০)।');
          }

          finalPaise = Math.round(dueRupees * 100);
          if (finalPaise <= 0) {
            finalPaise = 0; // Settled bill
          }

          const prevDue = getCustomerBalance(customer.id);
          const memoNo = (shop.entries.length + 1001);

          billData = {
            memoNo,
            items,
            grandTotal: Math.round(grandTotalRupees * 100),
            oldGoldDeduction: Math.round(oldGoldDeduction * 100),
            netBill: Math.round(netBillRupees * 100),
            cashPaid: Math.round(cashPaidNow * 100),
            due: finalPaise,
            previousDue: prevDue,
            grandTotalDue: prevDue + finalPaise,
            payMode: payModeKey((document.getElementById('pm-itemized') || {}).value),
            date: new Date().toISOString()
          };
        } else {
          // Single Amount Mode
          const amtVal = parseFloat(amtInput.value);
          if (isNaN(amtVal) || amtVal <= 0) {
            alert('সঠিক টাকার পরিমাণ দিন (শূন্য বা ঋণাত্মক গ্রহণযোগ্য নয়)।');
            return;
          }
          finalPaise = Math.round(amtVal * 100);
          if (finalPaise <= 0) {
            alert('সঠিক টাকার পরিমাণ দিন।');
            return;
          }
        }

        const entryId = shop.next++;
        const newEntry = {
          id: entryId,
          cid: customer.id,
          kind: kind,
          a: finalPaise,
          note: noteVal,
          at: new Date().toISOString(),
          bill: billData
        };
        const dueEl = document.getElementById('entry-due');
        const pmSingle = document.getElementById('pm-single');
        if (kind === 'joma' && pmSingle) newEntry.mode = payModeKey(pmSingle.value);
        if (kind === 'baki' && finalPaise > 0 && dueEl && dueEl.value) newEntry.dueDate = dueEl.value;

        shop.entries.push(newEntry);
        const stockWarns = billData ? applyStockForItems(shop, billData.items) : [];

        if (saveData()) {
          alertStockWarns(stockWarns);
          closeForm();
          renderCustomerView(customer.id);

          // If itemized bill, immediately show receipt dialog!
          if (billData) {
            showReceiptModal(newEntry, customer, shop);
          }
        }
      };
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    function inlineComputedStyles(src, dst) {
      const cs = window.getComputedStyle(src);
      for (let i = 0; i < cs.length; i++) {
        const prop = cs[i];
        if (/^(animation|transition)/.test(prop)) continue;
        dst.style.setProperty(prop, cs.getPropertyValue(prop));
      }
      for (let i = 0; i < src.children.length; i++) {
        inlineComputedStyles(src.children[i], dst.children[i]);
      }
    }

    async function renderElementToJpeg(el, scale) {
      const w = Math.ceil(el.getBoundingClientRect().width);
      const h = Math.ceil(el.getBoundingClientRect().height);
      const clone = el.cloneNode(true);
      inlineComputedStyles(el, clone);
      clone.style.margin = '0';
      clone.style.width = w + 'px';
      clone.style.boxSizing = 'border-box';
      const xhtml = new XMLSerializer().serializeToString(clone);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject x="0" y="0" width="${w}" height="${h}">${xhtml}</foreignObject></svg>`;
      const img = new Image();
      const loaded = new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      await loaded;
      const canvas = document.createElement('canvas');
      canvas.width = w * scale;
      canvas.height = h * scale;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0, w, h);
      const jpegBlob = await new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', 0.92));
      return { bytes: new Uint8Array(await jpegBlob.arrayBuffer()), pxW: canvas.width, pxH: canvas.height, w, h };
    }

    function buildPdfFromJpeg(jpg) {
      const enc = new TextEncoder();
      const margin = 24;
      const pageW = 360;                                   // points
      const imgW = pageW - margin * 2;
      const imgH = imgW * (jpg.pxH / jpg.pxW);
      const pageH = Math.ceil(imgH + margin * 2);
      const parts = [];
      const offsets = [];
      let pos = 0;
      const push = (u8) => { parts.push(u8); pos += u8.length; };
      const str = (t) => push(enc.encode(t));
      const obj = (n, body) => { offsets[n] = pos; str(`${n} 0 obj\n${body}\nendobj\n`); };

      str('%PDF-1.4\n');
      obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
      obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
      obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
      offsets[4] = pos;
      str(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${jpg.pxW} /Height ${jpg.pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.bytes.length} >>\nstream\n`);
      push(jpg.bytes);
      str('\nendstream\nendobj\n');
      const content = `q ${imgW.toFixed(2)} 0 0 ${imgH.toFixed(2)} ${margin} ${margin} cm /Im0 Do Q`;
      obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      const xrefPos = pos;
      let xref = 'xref\n0 6\n0000000000 65535 f \n';
      for (let i = 1; i <= 5; i++) xref += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
      str(xref + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);
      return new Blob(parts, { type: 'application/pdf' });
    }

    async function buildReceiptPdfBlob(el) {
      const jpg = await renderElementToJpeg(el, 2.5);
      return buildPdfFromJpeg(jpg);
    }

          ${isJewellery ? `<td><select class="item-purity"><option value="22K সোনা">২২K সোনা</option><option value="18K সোনা">১৮K সোনা</option><option value="রূপো">রূপো</option></select></td>` : ''}
          <td><input type="number" step="0.001" min="0.001" class="item-qty" value="${qty}"></td>
          <td><select class="item-unit">${cat.units.map(u => `<option value="${u}">${u}</option>`).join('')}</select></td>
          <td><input type="number" step="0.01" min="0" class="item-rate" placeholder="দর" value="${rate}"></td>
          ${isJewellery ? `<td><input type="number" step="0.01" min="0" class="item-making" value="0.00"></td>` : ''}
          <td><input type="number" class="item-total" readonly style="background: #f8f9fa;" value="0.00"></td>
          <td><button type="button" class="nb-del" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px;">✕</button></td>
        `;
        tbody.appendChild(tr);
        attachStockAutofill(tr, shop);
        tr.addEventListener('input', () => {
          tr.querySelector('.item-total').value = rowTotal(tr).toFixed(2);
          refresh();
        });
        tr.querySelector('.nb-del').onclick = () => { tr.remove(); refresh(); };
        refresh();
      }

      document.getElementById('nb-add-row').onclick = () => addRow();
      main.querySelectorAll('[data-sug]').forEach(btn => {
        btn.onclick = () => addRow(btn.getAttribute('data-sug'));
      });
      paidEl.addEventListener('input', refresh);
      main.querySelectorAll('[data-nbdue]').forEach(b => {
        b.onclick = () => {
          const n = Number(b.getAttribute('data-nbdue'));
          document.getElementById('nb-due').value = n ? addDaysStr(n) : '';
        };
      });
      const og = document.getElementById('nb-oldgold');
      if (og) og.addEventListener('input', refresh);
      custSel.onchange = () => {
        newCustBox.style.display = custSel.value === '__new__' ? 'block' : 'none';
      };

      addRow();

      document.getElementById('normal-bill-form').onsubmit = function(e) {
        e.preventDefault();
        const items = [];
        let grandRupees = 0;
        for (const tr of tbody.querySelectorAll('tr')) {
          const name = tr.querySelector('.item-name').value.trim();
          const qty = parseFloat(tr.querySelector('.item-qty').value);
          const rate = parseFloat(tr.querySelector('.item-rate').value);
          const unit = tr.querySelector('.item-unit').value;
          const purity = isJewellery ? tr.querySelector('.item-purity').value : '';
          const making = isJewellery ? (parseFloat(tr.querySelector('.item-making').value) || 0) : 0;
          if (!name || isNaN(qty) || qty <= 0 || isNaN(rate) || rate < 0) {
            alert('অনুগ্রহ করে প্রতিটি আইটেমের নাম, সঠিক পরিমাণ ও দর পূরণ করুন!');
            return;
          }
          const lineTotal = qty * rate + making;
          grandRupees += lineTotal;
          items.push({ name, qty, unit, rate, purity, making, lineTotal });
        }
        if (items.length === 0) { alert('অন্তত একটি আইটেম যোগ করুন!'); return; }

        const oldGold = isJewellery ? (parseFloat(document.getElementById('nb-oldgold').value) || 0) : 0;
        const totalPaise = Math.max(0, Math.round((grandRupees - oldGold) * 100));
        const paidPaise = Math.max(0, Math.round((parseFloat(paidEl.value) || 0) * 100));
        if (totalPaise <= 0) { alert('বিলের মোট টাকা শূন্য হতে পারে না!'); return; }

        const note = document.getElementById('nb-note').value.trim();
        const now = new Date();
        const shopBillsMax = Math.max(1000, ...shop.bills.map(r => (r.bill && r.bill.memoNo) || 0),
                                            ...shop.entries.map(en => (en.bill && en.bill.memoNo) || 0));
        const memoNo = shopBillsMax + 1;
        const fullyPaid = paidPaise === totalPaise;

        // Find (or create) customer
        const inName = document.getElementById('nb-name').value.trim();
        const inPhone = document.getElementById('nb-phone').value.trim();
        let customer = null;
        if (custSel.value !== '__new__') {
          customer = shop.customers.find(c => String(c.id) === String(custSel.value));
          if (!customer) { alert('গ্রাহক পাওয়া যায়নি!'); return; }
        } else {
          const normIn = normalizePhone(inPhone);
          const lname = inName.toLowerCase();
          if (normIn) customer = shop.customers.find(c => normalizePhone(c.phone) === normIn) || null;
          if (!customer && lname) {
            customer = shop.customers.find(c => {
              if (String(c.name).trim().toLowerCase() !== lname) return false;
              const np = normalizePhone(c.phone);
              return !normIn || !np || np === normIn;
            }) || null;
          }
          if (customer && !customer.phone && inPhone) customer.phone = inPhone;
          // Create the customer if there is a due, or if the shopkeeper typed a name/phone (so purchase history is kept)
          if (!customer && (!fullyPaid || inName || inPhone)) {
            customer = { id: shop.next++, name: inName || 'নগদ গ্রাহক', phone: inPhone };
            shop.customers.push(customer);
          }
        }

        const prevDue = customer ? getCustomerBalance(customer.id) : 0;
        const bill = {
          memoNo,
          items,
          grandTotal: Math.round(grandRupees * 100),
          oldGoldDeduction: Math.round(oldGold * 100),
          netBill: totalPaise,
          cashPaid: paidPaise,
          due: Math.max(0, totalPaise - paidPaise),
          previousDue: prevDue,
          grandTotalDue: prevDue + totalPaise - paidPaise,
          payMode: payModeKey(document.getElementById('nb-paymode').value),
          date: now.toISOString(),
          type: 'normal'
        };

        // Khata rules:
        //  paid < total  -> only the unpaid remainder goes to BAKI
        //  paid = total  -> nothing goes to the khata (bill record only)
        //  paid > total  -> only the extra goes to JOMA
        let entryId = null;
        if (customer && paidPaise < totalPaise) {
          entryId = shop.next++;
          shop.entries.push({ id: entryId, cid: customer.id, kind: 'baki', a: totalPaise - paidPaise,
            note: note || `বিল #${memoNo} (বাকি অংশ)`, at: now.toISOString(), bill,
            dueDate: document.getElementById('nb-due').value || null });
        } else if (customer && paidPaise > totalPaise) {
          entryId = shop.next++;
          shop.entries.push({ id: entryId, cid: customer.id, kind: 'joma', a: paidPaise - totalPaise,
            note: note || `বিল #${memoNo} (অতিরিক্ত জমা)`, at: now.toISOString(), bill, mode: bill.payMode });
        }

        const displayCustomer = customer || { name: inName || 'নগদ গ্রাহক', phone: inPhone };
        shop.bills.push({
          id: memoNo, cid: customer ? customer.id : null, name: displayCustomer.name, phone: displayCustomer.phone || '',
          entryId, at: now.toISOString(), note, bill
        });

        const stockWarns = applyStockForItems(shop, items);

        if (saveData()) {
          alertStockWarns(stockWarns);
          const receiptEntry = { id: entryId, bill };
          renderBillView();
          showReceiptModal(receiptEntry, displayCustomer, shop);
        }
      };

      renderRecentBills();
    }

    function renderRecentBills() {
      const shop = getActiveShop();

      const list = shop.bills.slice().sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 15);
      host.innerHTML = `
        <div class="card-title">📋 সাম্প্রতিক বিল (${shop.bills.length})</div>
        ${list.length === 0 ? '<div class="empty-state">এখনও কোনো বিল তৈরি হয়নি।</div>' : list.map(r => {
          const b = r.bill;
          const status = b.cashPaid === b.netBill ? '<span class="badge-joma">পেইড</span>'

            : `<span class="badge-baki">বাকি ${formatMoney(b.netBill - b.cashPaid)}</span>`;
          return `
            <div class="entry-item" style="margin-bottom: 6px;">

                <div class="entry-note">${escapeHtml(r.name)} — মোট ${formatMoney(b.netBill)}, পেইড ${formatMoney(b.cashPaid)}</div>
              </div>

                <button type="button" class="btn-entry-action" onclick="viewBillRecord(${r.id})">🧾 মেমো</button>

    }

    // ---------- Date helpers ----------
    function localDateStr(d) {
      d = d || new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function daysBetween(fromStr, toStr) {
      const a = fromStr.split('-').map(Number), b = toStr.split('-').map(Number);
      return Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000);
    }
    function addDaysStr(n) {
      const d = new Date();
      d.setDate(d.getDate() + n);
      return localDateStr(d);
    }
    function formatDueBn(s) {
      if (!s) return '';
      const p = s.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('bn-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function formatShortDateBn(at) {
      return new Date(at).toLocaleDateString('bn-IN', { day: 'numeric', month: 'short', year: '2-digit' });
    }
    function fmtSigned(p) {
      return (p < 0 ? '−' : '') + formatMoney(p);
    }

    // ---------- Due date / overdue ----------
    // Payments (joma) are applied to the oldest baki first; whatever remains unpaid
    // on entries with a past due date counts as overdue.
    function getCustomerDueInfo(shop, cid) {
      const ents = shop.entries
        .filter(e => String(e.cid) === String(cid))
        .sort((a, b) => new Date(a.at) - new Date(b.at) || a.id - b.id);
      let credit = 0;
      for (const e of ents) if (e.kind === 'joma') credit += e.a;
      const today = localDateStr();
      let overdue = 0, oldestDue = null, nextDue = null, nextDueAmt = 0;
      for (const e of ents) {
        if (e.kind !== 'baki') continue;
        let rem = e.a;
        const use = Math.min(credit, rem);
        credit -= use;
        rem -= use;
        if (rem <= 0 || !e.dueDate) continue;
        if (e.dueDate < today) {
          overdue += rem;
          if (!oldestDue || e.dueDate < oldestDue) oldestDue = e.dueDate;
        } else if (!nextDue || e.dueDate < nextDue) {
          nextDue = e.dueDate;
          nextDueAmt = rem;
        }
      }
      return {
        overdue, oldestDue, nextDue, nextDueAmt,
        daysOverdue: oldestDue ? daysBetween(oldestDue, today) : 0
      };
    }

    function buildReminderMsg(shop, customer, balance, info) {
      let msg = `নমস্কার ${customer.name}, ${shop.name}-এ আপনার মোট বাকি ₹${(balance / 100).toFixed(2)}।`;
      if (info && info.overdue > 0) {
        msg += ` এর মধ্যে ₹${(info.overdue / 100).toFixed(2)} পরিশোধের তারিখ (${formatDueBn(info.oldestDue)}) পেরিয়ে গেছে (${info.daysOverdue} দিন আগে)।`;
      } else if (info && info.nextDue) {
        msg += ` পরিশোধের তারিখ: ${formatDueBn(info.nextDue)}।`;
      }
      return msg + ' সুবিধামতো মিটিয়ে দেবেন। ধন্যবাদ।';
    }

    function homeAlertsHtml(shop) {
      let html = '';
      const today = localDateStr();
      const rows = [];
      for (const c of shop.customers) {
        const bal = getCustomerBalance(c.id);
        if (bal <= 0) continue;
        const info = getCustomerDueInfo(shop, c.id);
        const soon = !!info.nextDue && daysBetween(today, info.nextDue) <= 3;
        if (info.overdue > 0 || soon) rows.push({ c, bal, info });
      }
      rows.sort((a, b) =>
        ((b.info.overdue > 0) - (a.info.overdue > 0)) ||
        (b.info.daysOverdue - a.info.daysOverdue) ||
        String(a.info.nextDue).localeCompare(String(b.info.nextDue)));

      if (rows.length) {
        const shown = rows.slice(0, 8);
        html += `
          <div class="card" style="border-left: 5px solid var(--danger);">
            <div class="card-title">⏰ তাগাদার তালিকা (${rows.length})</div>
            ${shown.map(r => {
              const np = normalizePhone(r.c.phone);
              const wa = np ? `<a class="btn btn-sm btn-whatsapp" style="width:auto;" target="_blank" rel="noopener noreferrer" href="https://wa.me/${np}?text=${encodeURIComponent(buildReminderMsg(shop, r.c, r.bal, r.info))}">💬</a>` : '';
              let line;
              if (r.info.overdue > 0) {
                line = `<span class="due-chip over">মেয়াদ পেরিয়েছে ${r.info.daysOverdue} দিন</span> ${formatMoney(r.info.overdue)}`;
              } else {
                const dd = daysBetween(today, r.info.nextDue);
                line = `<span class="due-chip">📅 ${formatDueBn(r.info.nextDue)} (${dd === 0 ? 'আজ' : dd + ' দিন পরে'})</span> ${formatMoney(r.info.nextDueAmt)}`;
              }
              return `
                <div class="entry-item" style="margin-bottom:6px;">
                  <a href="#/c/${r.c.id}" class="entry-left" style="text-decoration:none;color:inherit;">
                    <div style="font-weight:700;">${escapeHtml(r.c.name)}</div>

            }).join('')}
            ${rows.length > shown.length ? `<div class="help-text">+ আরও ${rows.length - shown.length} জন</div>` : ''}
          </div>`;
      }

      const low = lowStockItems(shop);
      if (low.length) {
        html += `
          <a href="#/stock" class="notice-banner" style="display:block;text-decoration:none;margin-bottom:0;background:#fff5f5;border-color:#ffc9c9;color:#b91c1c;">
            📦 <strong>${low.length}টি আইটেমের স্টক কম:</strong> ${low.slice(0, 4).map(i => escapeHtml(i.name)).join(', ')}${low.length > 4 ? ' …' : ''}
          </a>`;
      }
      return html;
    }

    // ---------- Inventory ----------
    function normName(s) { return String(s || '').trim().toLowerCase(); }
    function stockQtyFmt(n) { return String(Math.round((Number(n) || 0) * 1000) / 1000); }

    function findStockItem(shop, name) {
      const n = normName(name);
      if (!n) return null;
      return (shop.inventory || []).find(i => normName(i.name) === n) || null;
    }

    function lowStockItems(shop) {
      return (shop.inventory || []).filter(i => i.qty <= 0 || (i.min > 0 && i.qty <= i.min));
    }

    function stockDatalistHtml(shop) {
      return `<datalist id="stock-names">${(shop.inventory || []).map(i => `<option value="${escapeHtml(i.name)}"></option>`).join('')}</datalist>`;
    }

    // When the shopkeeper picks a stock item name in a bill row: fill rate + unit
    function attachStockAutofill(tr, shop) {
      const nameEl = tr.querySelector('.item-name');
      if (!nameEl) return;
      nameEl.setAttribute('list', 'stock-names');
      nameEl.addEventListener('change', function () {
        const it = findStockItem(shop, nameEl.value);
        if (!it) return;
        const rateEl = tr.querySelector('.item-rate');
        if (rateEl && (!rateEl.value || parseFloat(rateEl.value) === 0) && it.price) {
          rateEl.value = (it.price / 100).toFixed(2);
        }
        const unitEl = tr.querySelector('.item-unit');
        if (unitEl && Array.from(unitEl.options).some(o => o.value === it.unit)) unitEl.value = it.unit;
        if (rateEl) rateEl.dispatchEvent(new Event('input', { bubbles: true }));
      });
    }

    // Deduct sold quantities from stock. Returns warning lines.
    function applyStockForItems(shop, items) {
      const warns = [];
      for (const it of items) {
        const s = findStockItem(shop, it.name);
        if (!s) continue;
        s.qty = Math.round((s.qty - it.qty) * 1000) / 1000;
        s.updatedAt = new Date().toISOString();
        if (s.qty < 0) warns.push(`${s.name}: স্টক ঋণাত্মক (${stockQtyFmt(s.qty)} ${s.unit}) — গুদাম হিসাব মিলিয়ে নিন`);
        else if (s.qty <= 0 || (s.min > 0 && s.qty <= s.min)) warns.push(`${s.name}: মাত্র ${stockQtyFmt(s.qty)} ${s.unit} বাকি`);
      }
      return warns;
    }

    function alertStockWarns(warns) {
      if (warns && warns.length) alert('⚠️ স্টক সতর্কতা:\n' + warns.join('\n'));
    }

    function renderStockView() {
      const shop = getActiveShop();

    // ---------- Multi-page PDF engine ----------
    // Pages are fixed-size A4-ratio HTML blocks; each is rendered to a JPEG and
    // packed into one PDF (same no-library approach as the receipt PDF).
    function buildPdfFromJpegs(jpgs) {
      const enc = new TextEncoder();
      const pageW = 595.28, pageH = 841.89;
      const parts = [];
      const offsets = [];
      let pos = 0;
      const push = (u8) => { parts.push(u8); pos += u8.length; };
      const str = (t) => push(enc.encode(t));
      const n = jpgs.length;
      const kids = jpgs.map((_, i) => `${3 + i * 3} 0 R`).join(' ');

      str('%PDF-1.4\n');
      offsets[1] = pos; str('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
      offsets[2] = pos; str(`2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${n} >>\nendobj\n`);
      jpgs.forEach((jpg, i) => {
        const pg = 3 + i * 3, im = 4 + i * 3, ct = 5 + i * 3;
        offsets[pg] = pos;
        str(`${pg} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
        offsets[im] = pos;
        str(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${jpg.pxW} /Height ${jpg.pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.bytes.length} >>\nstream\n`);
        push(jpg.bytes);
        str('\nendstream\nendobj\n');
        const content = `q ${pageW} 0 0 ${pageH} 0 0 cm /Im${i} Do Q`;
        offsets[ct] = pos;
        str(`${ct} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
      });
      const total = 3 + n * 3;
      const xrefPos = pos;
      let xref = `xref\n0 ${total}\n0000000000 65535 f \n`;
      for (let i = 1; i < total; i++) xref += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
      str(xref + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);
      return new Blob(parts, { type: 'application/pdf' });
    }

    async function renderPagesToPdfBlob(pagesHtml) {
      const host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:-10000px;top:0;width:720px;';
      document.body.appendChild(host);
      const jpgs = [];
      try {
        for (const html of pagesHtml) {
          host.innerHTML = html;
          jpgs.push(await renderElementToJpeg(host.firstElementChild, 2));
        }
      } finally {
        host.remove();
      }
      return buildPdfFromJpegs(jpgs);
    }

      const statusEl = document.getElementById('pdf-gen-status');
      async function makeFile() {
        statusEl.textContent = 'PDF তৈরি হচ্ছে... একটু অপেক্ষা করুন';

        try {
          const file = await makeFile();
          if (navigator.canShare && navigator.canShare({ files: [file] })) {

          }
          downloadBlob(file, opts.filename);
          statusEl.textContent = 'PDF ডাউনলোড হয়েছে। হোয়াটসঅ্যাপ চ্যাটে 📎 দিয়ে ওই PDF ফাইলটি অ্যাটাচ করে পাঠান।';
          const np = normalizePhone(opts.phone);
          if (np) window.open(`https://wa.me/${np}?text=${encodeURIComponent(opts.waText || '')}`, '_blank', 'noopener');
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          statusEl.textContent = 'PDF পাঠানো যায়নি। "PDF ডাউনলোড" ব্যবহার করুন।';
        }
      };
    }

    function rptPage(shop, title, sub, inner, pageNo, total) {
      const cat = CATEGORIES[shop.category] || CATEGORIES.general;
      const head = pageNo === 1 ? `
        <div class="rpt-head">
          <div class="rpt-shop">${cat.icon} ${escapeHtml(shop.name)}</div>
          <div class="rpt-sub">${escapeHtml(cat.name)}${shop.phone ? ' • 📞 ' + escapeHtml(shop.phone) : ''}${shop.address ? ' • 📍 ' + escapeHtml(shop.address) : ''}</div>
          <div class="rpt-title">${title}</div>

        </div>` : `
        <div class="rpt-head-sm"><strong>${escapeHtml(shop.name)}</strong> — ${title} <span>${sub}</span></div>`;
      return `<div class="rpt-page">${head}<div class="rpt-body">${inner}</div><div class="rpt-foot"><span>${escapeHtml(shop.name)} • তৈরি: ${new Date().toLocaleDateString('bn-IN')}</span><span>পৃষ্ঠা ${pageNo}/${total}</span></div></div>`;
    }

    // stream items: {type:'sec', title, head[], aligns[], widths[]} | {type:'row', cells[]}
    function paginateStream(stream, firstCap, nextCap) {
      const pages = [];
      let cur = [], used = 0, cap = firstCap, curSec = null;
      const flush = () => { if (cur.length) pages.push(cur); cur = []; used = 0; cap = nextCap; };
      for (const it of stream) {
        if (it.type === 'sec') {
          if (used + 4 > cap) flush();
          cur.push(it); used += 3; curSec = it;
          continue;
        }
        if (used + 1 > cap) {
          flush();
          if (curSec) { cur.push(Object.assign({}, curSec, { cont: true })); used += 3; }
        }
        cur.push(it); used += 1;
      }
      if (cur.length) pages.push(cur);
      return pages;
    }

    function renderStreamPage(items) {
      let html = '', open = false, sec = null;
      for (const it of items) {
        if (it.type === 'sec') {
          if (open) { html += '</tbody></table>'; open = false; }
          sec = it;
          html += `<div class="rpt-sec-title">${it.title}${it.cont ? ' <small>(পরের অংশ)</small>' : ''}</div>
            <table class="rpt-table"><colgroup>${it.widths.map(w => `<col style="width:${w}%">`).join('')}</colgroup>
            <thead><tr>${it.head.map((h, i) => `<th class="${it.aligns[i] || ''}">${h}</th>`).join('')}</tr></thead><tbody>`;
          open = true;
        } else {
          html += `<tr>${it.cells.map((c, i) => `<td class="${sec.aligns[i] || ''}">${c}</td>`).join('')}</tr>`;
        }
      }
      if (open) html += '</tbody></table>';
      return html;
    }

    // firstCap === 0 -> page 1 holds only firstInner; the stream starts on page 2
    function assemblePages(shop, title, sub, firstInner, stream, firstCap, nextCap) {
      const sp = paginateStream(stream, firstCap || nextCap, nextCap);
      const parts = [];
      if (firstCap === 0) {
        parts.push(firstInner);
        sp.forEach(p => parts.push(renderStreamPage(p)));
      } else if (sp.length === 0) {
        parts.push(firstInner);
      } else {
        sp.forEach((p, i) => parts.push(i === 0 ? firstInner + renderStreamPage(p) : renderStreamPage(p)));
      }
      return parts.map((inner, i) => rptPage(shop, title, sub, inner, i + 1, parts.length));
    }

    // ---------- Monthly report ----------
    var reportMonth = null;

    function monthLabelBn(ym) {
      const p = ym.split('-').map(Number);
      return new Date(p[0], p[1] - 1, 1).toLocaleDateString('bn-IN', { month: 'long', year: 'numeric' });
    }

    // Each bill once: normal bills live in shop.bills, old itemized bills sit on entries
    function allBillsList(shop) {
      const list = [];
      for (const r of (shop.bills || [])) {
        if (r.bill) list.push({ at: r.at, bill: r.bill, name: r.name || 'নগদ গ্রাহক' });
      }
      for (const e of shop.entries) {
        if (e.bill && e.bill.type !== 'normal') {
          const c = shop.customers.find(c => String(c.id) === String(e.cid));
          list.push({ at: e.at, bill: e.bill, name: c ? c.name : '—' });
        }
      }
      return list;
    }

    function getMonthlyData(shop, ym) {
      const inMonth = (at) => localDateStr(new Date(at)).slice(0, 7) === ym;
      const bills = allBillsList(shop).filter(b => inMonth(b.at)).sort((a, b) => new Date(a.at) - new Date(b.at));
      let sales = 0, cashOnBills = 0;
      const itemMap = {};
      for (const b of bills) {
        sales += b.bill.netBill || 0;
        cashOnBills += b.bill.cashPaid || 0;
        for (const it of (b.bill.items || [])) {
          const k = normName(it.name);
          if (!itemMap[k]) itemMap[k] = { name: it.name, unit: it.unit, qty: 0, amt: 0 };
          itemMap[k].qty += it.qty;
          itemMap[k].amt += Math.round(it.lineTotal * 100);
        }
      }
      let standaloneJoma = 0, newCredit = 0;
      for (const e of shop.entries) {
        if (!inMonth(e.at)) continue;
        if (e.kind === 'joma' && !e.bill) standaloneJoma += e.a;
        if (e.kind === 'baki') newCredit += e.a;
      }
      const exps = shop.expenses.filter(x => inMonth(x.at)).sort((a, b) => new Date(a.at) - new Date(b.at));
      const expTotal = exps.reduce((s, x) => s + x.a, 0);
      const expByCat = {};
      exps.forEach(x => { expByCat[x.category] = (expByCat[x.category] || 0) + x.a; });
      let overdueTotal = 0;
      for (const c of shop.customers) overdueTotal += getCustomerDueInfo(shop, c.id).overdue;
      const cashReceived = cashOnBills + standaloneJoma;
      return {
        ym, bills, sales, cashOnBills, standaloneJoma, cashReceived, newCredit,
        exps, expTotal, expByCat,
        netCash: cashReceived - expTotal,
        topItems: Object.values(itemMap).sort((a, b) => b.amt - a.amt).slice(0, 8),
        outstanding: getTotalOutstanding(),
        overdueTotal
      };
    }

    function monthlyTilesHtml(d) {
      return `<div class="rpt-tiles">
        ${rptTile('মোট বিক্রি (' + d.bills.length + 'টি বিল)', formatMoney(d.sales), '#1b2a41')}
        ${rptTile('নগদ আদায় (বিল + বাকি জমা)', formatMoney(d.cashReceived), '#1f6b4a')}
        ${rptTile('নতুন বাকি দেওয়া', formatMoney(d.newCredit), '#b3261e')}
        ${rptTile('দোকানের খরচ', formatMoney(d.expTotal), '#b3261e')}
        ${rptTile('নিট নগদ (আদায় − খরচ)', fmtSigned(d.netCash), d.netCash >= 0 ? '#1f6b4a' : '#b3261e')}
        ${rptTile('বর্তমান মোট বাকি', formatMoney(d.outstanding), '#b3261e')}
        ${rptTile('এর মধ্যে মেয়াদ পেরিয়েছে', formatMoney(d.overdueTotal), '#b3261e')}
        ${rptTile('বিলে নগদ / বাকি জমা', formatMoney(d.cashOnBills) + ' / ' + formatMoney(d.standaloneJoma), '#1b2a41')}
      </div>`;
    }

    function buildMonthlyReportPages(shop, ym) {
      const d = getMonthlyData(shop, ym);
      const catRows = Object.keys(d.expByCat).sort((a, b) => d.expByCat[b] - d.expByCat[a]);
      let first = monthlyTilesHtml(d);
      if (catRows.length) {
        first += `<div class="rpt-sec-title">খরচের ধরন অনুযায়ী</div>
          <table class="rpt-table"><colgroup><col style="width:70%"><col style="width:30%"></colgroup>
          <thead><tr><th>ধরন</th><th class="r">টাকা</th></tr></thead><tbody>
          ${catRows.slice(0, 8).map(k => `<tr><td>${escapeHtml(k)}</td><td class="r">${formatMoney(d.expByCat[k])}</td></tr>`).join('')}
          </tbody></table>`;
      }

      const stream = [];
      if (d.topItems.length) {
        stream.push({ type: 'sec', title: 'সর্বাধিক বিক্রিত আইটেম', head: ['পণ্য', 'পরিমাণ', 'বিক্রি (₹)'], aligns: ['', 'r', 'r'], widths: [50, 25, 25] });
        d.topItems.forEach(t => stream.push({ type: 'row', cells: [escapeHtml(t.name), stockQtyFmt(t.qty) + ' ' + escapeHtml(t.unit), formatMoney(t.amt)] }));
      }
      if (d.bills.length) {
        stream.push({ type: 'sec', title: 'বিলের তালিকা', head: ['মেমো', 'তারিখ', 'গ্রাহক', 'মোট', 'পেইড', 'বাকি'], aligns: ['', '', '', 'r', 'r', 'r'], widths: [12, 16, 28, 15, 15, 14] });
        d.bills.forEach(b => stream.push({
          type: 'row',
          cells: ['#' + b.bill.memoNo, formatShortDateBn(b.at), escapeHtml(b.name), formatMoney(b.bill.netBill), formatMoney(b.bill.cashPaid), formatMoney(Math.max(0, b.bill.netBill - b.bill.cashPaid))]
        }));
      }
      if (d.exps.length) {
        stream.push({ type: 'sec', title: 'খরচের তালিকা', head: ['তারিখ', 'ধরন', 'বিবরণ', 'টাকা'], aligns: ['', '', '', 'r'], widths: [18, 27, 38, 17] });
        d.exps.forEach(x => stream.push({ type: 'row', cells: [formatShortDateBn(x.at), escapeHtml(x.category), escapeHtml(x.note || '—'), formatMoney(x.a)] }));
      }
      return assemblePages(shop, '📊 মাসিক রিপোর্ট', monthLabelBn(ym), first, stream, 0, 28);
    }

    function openMonthlyReport(ym) {
      const shop = getActiveShop();
      const pages = buildMonthlyReportPages(shop, ym);
      showPdfPreviewModal({
        title: '📊 মাসিক রিপোর্ট — ' + monthLabelBn(ym),
        pages,
        filename: `monthly_report_${ym}.pdf`,
        waText: `${shop.name} — ${monthLabelBn(ym)} মাসের হিসাব রিপোর্ট (PDF)।`
      });
    }

    // ---------- Customer statement ----------
    function buildStatementPages(shop, customer, from, to) {
      const ents = shop.entries
        .filter(e => String(e.cid) === String(customer.id))
        .sort((a, b) => new Date(a.at) - new Date(b.at) || a.id - b.id);
      let opening = 0;
      const inRange = [];
      for (const e of ents) {
        const day = localDateStr(new Date(e.at));
        const delta = e.kind === 'baki' ? e.a : -e.a;
        if (from && day < from) { opening += delta; continue; }
        if (to && day > to) continue;
        inRange.push(e);
      }

      let bal = opening, totBaki = 0, totJoma = 0;
      const rows = [];
      if (from) rows.push({ type: 'row', cells: ['', '<em>পূর্বের জের</em>', '', '', fmtSigned(opening)] });
      for (const e of inRange) {
        bal += e.kind === 'baki' ? e.a : -e.a;
        if (e.kind === 'baki') totBaki += e.a; else totJoma += e.a;
        let desc;
        if (e.bill) {
          desc = `বিল #${e.bill.memoNo}: ` + e.bill.items.map(i => i.name).join(', ');
        } else {
          desc = e.note || (e.kind === 'baki' ? 'বাকি' : 'জমা');
        }
        if (e.kind === 'baki' && e.dueDate) desc += ` (দেয়: ${formatDueBn(e.dueDate)})`;
        rows.push({
          type: 'row',
          cells: [
            formatShortDateBn(e.at),
            escapeHtml(desc),
            e.kind === 'baki' ? `<span class="rpt-red">${formatMoney(e.a)}</span>` : '',
            e.kind === 'joma' ? `<span class="rpt-green">${formatMoney(e.a)}</span>` : '',
            fmtSigned(bal)
          ]
        });
      }
      rows.push({ type: 'row', cells: ['', '<b>মোট</b>', `<b>${formatMoney(totBaki)}</b>`, `<b>${formatMoney(totJoma)}</b>`, `<b>${fmtSigned(bal)}</b>`] });

      const info = getCustomerDueInfo(shop, customer.id);
      const period = (from || to) ? `${from ? formatDueBn(from) : 'শুরু'} থেকে ${to ? formatDueBn(to) : 'আজ'} পর্যন্ত` : 'সব লেনদেন';
      const balLabel = bal > 0 ? 'আপনার বাকি' : bal < 0 ? 'অগ্রিম জমা' : 'সব পরিশোধিত';
      const first = `
        <div class="rpt-box">
          <div><span class="k">গ্রাহক</span> <strong>${escapeHtml(customer.name)}</strong></div>
          ${customer.phone ? `<div><span class="k">মোবাইল</span> ${escapeHtml(customer.phone)}</div>` : ''}
          <div><span class="k">সময়কাল</span> ${period}</div>
          <div><span class="k">স্টেটমেন্টের তারিখ</span> ${formatDueBn(localDateStr())}</div>
        </div>
        <div class="rpt-tiles" style="grid-template-columns: repeat(${from ? 4 : 3}, 1fr);">
          ${from ? rptTile('পূর্বের জের', fmtSigned(opening), '#1b2a41') : ''}
          ${rptTile('বাকি দেওয়া', formatMoney(totBaki), '#b3261e')}
          ${rptTile('জমা পেয়েছি', formatMoney(totJoma), '#1f6b4a')}
          ${rptTile(balLabel, formatMoney(bal), bal > 0 ? '#b3261e' : '#1f6b4a')}
        </div>
        ${(!to && info.overdue > 0) ? `<div class="rpt-warn">⏰ এর মধ্যে ${formatMoney(info.overdue)} পরিশোধের তারিখ পেরিয়ে গেছে (${info.daysOverdue} দিন আগে থেকে)।</div>` : ''}
      `;
      const stream = [{ type: 'sec', title: 'লেনদেনের বিবরণ', head: ['তারিখ', 'বিবরণ', 'বাকি (₹)', 'জমা (₹)', 'ব্যালেন্স (₹)'], aligns: ['', '', 'r', 'r', 'r'], widths: [15, 37, 15, 15, 18] }].concat(rows);
      return { pages: assemblePages(shop, '📄 গ্রাহক স্টেটমেন্ট', escapeHtml(customer.name), first, stream, 16, 28), closing: bal };
    }

    function openStatement(cid, from, to) {
      const shop = getActiveShop();
      const c = shop.customers.find(x => String(x.id) === String(cid));
      if (!c) { alert('গ্রাহক পাওয়া যায়নি!'); return; }
      const res = buildStatementPages(shop, c, from, to);
      const safe = (c.name || 'customer').replace(/[\\/:*?"<>|\s]+/g, '_');
      showPdfPreviewModal({
        title: '📄 স্টেটমেন্ট — ' + escapeHtml(c.name),
        pages: res.pages,
        filename: `statement_${safe}_${localDateStr()}.pdf`,
        phone: c.phone,
        waText: `নমস্কার ${c.name}, ${shop.name}-এর হিসাবের স্টেটমেন্ট (PDF) পাঠানো হল।${res.closing > 0 ? ` বর্তমান বাকি ₹${(res.closing / 100).toFixed(2)}।` : ''} ধন্যবাদ।`
      });
    }

    function showStatementOptionsModal(cid) {
      const shop = getActiveShop();
      const c = shop.customers.find(x => String(x.id) === String(cid));
      if (!c) return;
      openModal(`
        <div class="modal-box">
          <div class="modal-box-header">
            <div class="modal-box-title">📄 স্টেটমেন্ট PDF — ${escapeHtml(c.name)}</div>
            <button type="button" onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
          </div>
          <div class="modal-box-body">
            <p class="help-text mb-3">সব লেনদেনের জন্য তারিখ ফাঁকা রাখুন, অথবা সময়কাল বেছে নিন।</p>
            <form id="stmt-form" novalidate>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="form-group"><label for="stmt-from">কোন তারিখ থেকে</label><input type="date" id="stmt-from"></div>
                <div class="form-group"><label for="stmt-to">কোন তারিখ পর্যন্ত</label><input type="date" id="stmt-to"></div>
              </div>
              <button type="submit" class="btn btn-primary mt-2">স্টেটমেন্ট তৈরি করুন</button>
            </form>
          </div>
        </div>`);
      document.getElementById('stmt-form').onsubmit = function (e) {
        e.preventDefault();
        const from = document.getElementById('stmt-from').value;
        const to = document.getElementById('stmt-to').value;
        if (from && to && from > to) { alert('শুরুর তারিখ শেষের তারিখের পরে হতে পারে না!'); return; }
        closeModal();
        openStatement(cid, from, to);
      };
    }

    // ---------- Reports view ----------
    function renderReportsView() {
      const shop = getActiveShop();
      const main = document.getElementById('app-main');
      const ym = reportMonth || localDateStr().slice(0, 7);
      const custOpts = shop.customers.slice().sort((a, b) => a.name.localeCompare(b.name))
        .map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)} — ${fmtSigned(getCustomerBalance(c.id))}</option>`).join('');

      main.innerHTML = `
        <div class="card">
          <div class="card-title">📊 মাসিক রিপোর্ট (PDF)</div>
          <div class="form-group">
            <label for="rp-month">মাস বেছে নিন</label>
            <input type="month" id="rp-month" value="${ym}">
          </div>
          <div id="rp-summary"></div>
          <button type="button" class="btn btn-primary mt-3" id="btn-rp-open">📄 রিপোর্ট দেখুন ও PDF করুন</button>
        </div>

        <div class="card">
          <div class="card-title">👥 গ্রাহকের স্টেটমেন্ট (PDF)</div>
          ${shop.customers.length === 0 ? '<div class="empty-state">আগে একজন গ্রাহক যোগ করুন।</div>' : `
            <div class="form-group">
              <label for="rp-cust">গ্রাহক</label>
              <select id="rp-cust">${custOpts}</select>
            </div>
            <button type="button" class="btn btn-primary" id="btn-rp-stmt">📄 স্টেটমেন্ট তৈরি করুন</button>
            <div class="help-text mt-2">গ্রাহকের পাতা থেকেও এই স্টেটমেন্ট বানানো যায়।</div>`}
        </div>
      `;

      const monthEl = document.getElementById('rp-month');
      const sumEl = document.getElementById('rp-summary');
      function refresh() {
        const v = monthEl.value;
        if (!/^\d{4}-\d{2}$/.test(v)) { sumEl.innerHTML = '<div class="help-text">মাস বেছে নিন (যেমন 2026-11)।</div>'; return; }
        reportMonth = v;
        sumEl.innerHTML = monthlyTilesHtml(getMonthlyData(shop, v));
      }
      monthEl.addEventListener('input', refresh);
      monthEl.addEventListener('change', refresh);
      refresh();

      document.getElementById('btn-rp-open').onclick = function () {
        if (!/^\d{4}-\d{2}$/.test(monthEl.value)) { alert('সঠিক মাস বেছে নিন!'); return; }
        openMonthlyReport(monthEl.value);
      };
      const stmtBtn = document.getElementById('btn-rp-stmt');
      if (stmtBtn) stmtBtn.onclick = () => showStatementOptionsModal(document.getElementById('rp-cust').value);
    }

    // ==========================================
    // Application Router & Lifecycle
    // ==========================================
    function renderApp() {
      // First call: work out the vault state (needs async crypto/IndexedDB), then render.
      if (!vault.initDone) {
        if (!vault.initPromise) {
          vault.initPromise = vaultInit()
            .catch(function (err) { console.error('Vault init failed:', err); })
            .then(function () { vault.initDone = true; renderApp(); });
          const m = document.getElementById('app-main');
          if (m) m.innerHTML = '<div class="card text-center"><p class="help-text">লোড হচ্ছে…</p></div>';
        }
        return;
      }

      vaultCheckExpiry();

      if (!vault.cryptoOk) {
        appData = null;
        updateHeader();
        renderNoCryptoView();
        return;
      }

      appData = vault.mode === 'unlocked' ? loadData() : null;
      updateHeader();

      const hash = window.location.hash || '#/';

      // Case 1: First time setup
      if (vault.mode === 'setup') {
        if (hash !== '#/setup') window.location.hash = '#/setup';
        renderSetupView();
        return;
      }

      // Case 1b: stored data cannot be read
      if (vault.mode === 'corrupt' || (vault.mode === 'unlocked' && !appData)) {
        renderCorruptView();
        return;
      }

      // Case 1c: old unencrypted data waiting to be upgraded
      if (vault.mode === 'legacy') {
        if (hash === '#/forgot') {
          renderLegacyForgotView();
        } else {
          if (hash !== '#/login') window.location.hash = '#/login';
          renderLegacyLoginView();
        }
        return;
      }

      // Case 2: Locked (not logged in, session expired or logged out)
      if (!isLoggedIn()) {
        if (hash === '#/forgot') {
          renderForgotView();
        } else {
          if (hash !== '#/login') window.location.hash = '#/login';
          renderLoginView();
        }
        return;
      }

      // Case 3: Logged in - Route to requested view
      if (hash === '#/setup' || hash === '#/login' || hash === '#/forgot') {
        window.location.hash = '#/';
        renderHomeView();
        return;
      }

      if (hash.startsWith('#/c/')) {
        const cid = hash.slice(4);
        renderCustomerView(cid);
      } else if (hash === '#/bill') {
        renderBillView();
      } else if (hash === '#/expenses') {
        renderExpensesView();
      } else if (hash === '#/shifts') {
        renderShiftsView();
      } else if (hash === '#/stock') {
        renderStockView();
      } else if (hash === '#/reports') {
        renderReportsView();
      } else if (hash === '#/settings') {
        renderSettingsView();
      } else {
        renderHomeView();
      }
    }

    // Hash change and load handlers
    window.addEventListener('hashchange', renderApp);
    window.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
