<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
  <title>দোকানের খাতা - ডিজিটাল বাকি খাতা ও বিলিং</title>
  <style>
    :root {
      --primary: #0b6e4f;
      --primary-dark: #084d37;
      --primary-light: #e8f5f0;
      --danger: #c92a2a;
      --danger-light: #ffebee;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --info: #0284c7;
      --info-light: #e0f2fe;
      --text: #212529;
      --text-muted: #6c757d;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --border: #dee2e6;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", "SolaimanLipi", "Kalpurush", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #app-container {
      width: 100%;
      max-width: 640px;
      background-color: var(--card-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      position: relative;
    }

    /* Header */
    header {
      background-color: var(--primary);
      color: #ffffff;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Shop Switcher Button in Header */
    .shop-switcher-btn {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-align: left;
      min-width: 0;
      flex: 1;
      transition: background 0.15s ease;
    }

    .shop-switcher-btn:hover, .shop-switcher-btn:active {
      background: rgba(255, 255, 255, 0.28);
    }

    .shop-cat-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .shop-info-wrap {
      min-width: 0;
      flex: 1;
    }

    .header-shop-name {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .header-cat-label {
      font-size: 11px;
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .shop-switch-arrow {
      font-size: 11px;
      opacity: 0.8;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      transition: background 0.15s ease;
      min-height: 36px;
    }

    .nav-btn:hover, .nav-btn:active {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Sub-nav bar for quick switching between views */
    .sub-navbar {
      background: #ffffff;
      border-bottom: 1.5px solid var(--border);
      display: flex;
      padding: 4px 8px;
      gap: 4px;
      position: sticky;
      top: 59px;
      z-index: 90;
    }

    .sub-nav-item {
      flex: 1;
      text-align: center;
      padding: 8px 2px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .sub-nav-item.active {
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 700;
    }

    /* Main Content */
    main {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Cards */
    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    /* Day Shift Register Banner */
    .shift-banner {
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1.5px solid transparent;
    }

    .shift-open {
      background: var(--primary-light);
      border-color: #a3d9c7;
    }

    .shift-closed {
      background: #fef3c7;
      border-color: #fde68a;
    }

    .shift-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .shift-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 700;
    }

    .shift-status-badge.open {
      color: var(--primary);
    }

    .shift-status-badge.closed {
      color: var(--warning);
    }

    .shift-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 4px;
      text-align: center;
    }

    .shift-stat-box {
      background: #ffffff;
      padding: 8px 6px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .shift-stat-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .shift-stat-val {
      font-size: 14px;
      font-weight: 700;
    }

    /* Total Outstanding Banner */
    .outstanding-banner {
      background: linear-gradient(135deg, #0b6e4f 0%, #084d37 100%);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(11, 110, 79, 0.2);
    }

    .outstanding-label {
      font-size: 13px;
      opacity: 0.92;
      margin-bottom: 2px;
    }

    .outstanding-amount {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .outstanding-sub {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* Filter Pills */
    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 4px;
    }

    .pill-btn {
      background: #ffffff;
      border: 1.5px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pill-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    /* Search Input */
    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s ease;
      min-height: 42px;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #333333;
    }

    input[type="text"],
    input[type="password"],
    input[type="tel"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s ease;
      min-height: 42px;
      background-color: #ffffff;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .help-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      min-height: 42px;
      transition: all 0.15s ease;
    }

    .btn-sm {
      min-height: 32px;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover, .btn-primary:active {
      background-color: var(--primary-dark);
    }

    .btn-baki {
      background-color: var(--danger);
      color: #ffffff;
    }

    .btn-baki:hover, .btn-baki:active {
      background-color: #a82323;
    }

    .btn-joma {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-joma:hover, .btn-joma:active {
      background-color: var(--primary-dark);
    }

    .btn-whatsapp {
      background-color: #25d366;
      color: #ffffff;
      font-weight: 700;
    }

    .btn-whatsapp:hover, .btn-whatsapp:active {
      background-color: #20ba5a;
    }

    .btn-outline {
      background-color: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover, .btn-outline:active {
      background-color: #f1f3f5;
    }

    .btn-outline-primary {
      background-color: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline-primary:hover, .btn-outline-primary:active {
      background-color: var(--primary-light);
    }

    .btn-outline-danger {
      background-color: transparent;
      border: 1.5px solid var(--danger);
      color: var(--danger);
    }

    .btn-outline-danger:hover, .btn-outline-danger:active {
      background-color: var(--danger-light);
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-row .btn {
      flex: 1;
    }

    /* Customer List */
    .customer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
    }

    .customer-item {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 52px;
    }

    .customer-item:hover, .customer-item:active {
      border-color: var(--primary);
      background-color: #fafbfc;
    }

    .customer-info {
      min-width: 0;
      flex: 1;
    }

    .customer-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .customer-phone {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .customer-balance-box {
      text-align: right;
      flex-shrink: 0;
    }

    .customer-balance-val {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .val-baki {
      color: var(--danger);
    }

    .val-joma {
      color: var(--primary);
    }

    .val-settled {
      color: var(--text-muted);
    }

    .badge-baki {
      background: var(--danger-light);
      color: var(--danger);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }

    .badge-joma {
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }

    /* Customer View Header */
    .cust-head-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .cust-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .cust-name-lg {
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
      word-break: break-word;
    }

    .cust-phone-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-edit-phone {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      text-decoration: underline;
    }

    /* Customer Balance Hero */
    .cust-balance-hero {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .hero-baki {
      background: var(--danger-light);
      border: 1.5px solid #f8b4b4;
    }

    .hero-baki .hero-label, .hero-baki .hero-amount {
      color: var(--danger);
    }

    .hero-joma {
      background: var(--primary-light);
      border: 1.5px solid #a3d9c7;
    }

    .hero-joma .hero-label, .hero-joma .hero-amount {
      color: var(--primary);
    }

    .hero-label {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .hero-amount {
      font-size: 26px;
      font-weight: 800;
    }

    /* WhatsApp Hint */
    .wa-hint {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      color: #856404;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* History Entries */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .entry-item {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .entry-left {
      min-width: 0;
      flex: 1;
    }

    .entry-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .entry-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    .entry-note {
      font-size: 13px;
      color: var(--text);
      word-break: break-word;
    }

    .entry-right {
      text-align: right;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .entry-amount {
      font-size: 15px;
      font-weight: 700;
    }

    .entry-actions-row {
      display: flex;
      gap: 4px;
    }

    .btn-entry-action {
      background: transparent;
      border: none;
      color: #6c757d;
      font-size: 12px;
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .btn-entry-action:hover {
      color: var(--primary);
      background-color: var(--primary-light);
    }

    .btn-delete-entry:hover {
      color: var(--danger) !important;
      background-color: var(--danger-light) !important;
    }

    /* Item suggestions pills */
    .suggestion-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .sug-pill {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #b7e3d3;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .sug-pill:hover, .sug-pill:active {
      background: var(--primary);
      color: #ffffff;
    }

    /* Itemized Table inside form */
    .bill-items-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .bill-items-table th {
      background: #f8f9fa;
      padding: 6px 8px;
      border: 1px solid var(--border);
      text-align: left;
      font-weight: 700;
    }

    .bill-items-table td {
      padding: 6px 8px;
      border: 1px solid var(--border);
      vertical-align: middle;
    }

    .bill-item-row input, .bill-item-row select {
      min-height: 34px;
      padding: 4px 6px;
      font-size: 13px;
      border-radius: 4px;
    }

    /* Modal / Popup Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-box {
      background: #ffffff;
      border-radius: var(--radius);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }

    .modal-box-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 10;
    }

    .modal-box-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-box-body {
      padding: 16px;
      flex: 1;
    }

    .modal-box-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      background: #fafafa;
    }

    /* Printable Cash Memo / Receipt Styling */
    .receipt-container {
      background: #ffffff;
      border: 2px dashed #333333;
      border-radius: 8px;
      padding: 16px;
      color: #000000;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      line-height: 1.4;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .receipt-header {
      text-align: center;
      border-bottom: 1px dashed #333333;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .receipt-shop-name {
      font-size: 18px;
      font-weight: 900;
      font-family: inherit;
    }

    .receipt-shop-sub {
      font-size: 12px;
      margin-top: 2px;
    }

    .receipt-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .receipt-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 12px;
    }

    .receipt-table th {
      border-top: 1px dashed #333333;
      border-bottom: 1px dashed #333333;
      padding: 5px 2px;
      text-align: left;
    }

    .receipt-table td {
      padding: 4px 2px;
      vertical-align: top;
    }

    .receipt-total-section {
      border-top: 1px dashed #333333;
      border-bottom: 1px dashed #333333;
      padding: 6px 0;
      margin: 8px 0;
    }

    .receipt-total-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }

    .receipt-grand-due {
      font-size: 15px;
      font-weight: 900;
      padding-top: 4px;
      border-top: 1px solid #333333;
      margin-top: 4px;
    }

    .receipt-footer {
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
    }

    /* Print Styles: ONLY print receipt cleanly */
    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      #app-container, header, .sub-navbar, .no-print, .btn, .modal-box-header, .modal-box-footer {
        display: none !important;
      }
      .modal-overlay {
        position: static !important;
        padding: 0 !important;
        background: transparent !important;
      }
      .modal-box {
        max-width: 100% !important;
        box-shadow: none !important;
        border: none !important;
      }
      .receipt-container {
        border: 1px solid #000000 !important;
        max-width: 380px !important;
        margin: 0 auto !important;
        page-break-inside: avoid;
      }
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 6px;
      opacity: 0.7;
    }

    /* Notice banner */
    .notice-banner {
      background: #e3f2fd;
      border: 1px solid #bbdefb;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      color: #0d47a1;
      margin-bottom: 10px;
    }

    /* Utilities */
    .text-center { text-align: center; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .hidden-input { display: none; }
  
    /* =====================================================
       Lal Khata theme: cloth-bound red ledger cover, ruled paper,
       rubber-stamped cash memo
       ===================================================== */
    :root {
      --ink: #1b2a41;
      --binding: #7f1d1d;
      --binding-dark: #5e1313;
      --haldi: #e3b341;
      --paper: #fbfbf8;
      --rule: rgba(70, 110, 150, 0.14);
      --primary: #1f6b4a;
      --primary-dark: #154b34;
      --primary-light: #e6f1eb;
      --danger: #b3261e;
      --danger-light: #fbecea;
      --text: #1b2a41;
      --text-muted: #5f6b7a;
      --border: #d5d2c8;
      --radius: 8px;
      --serif: "Tiro Bangla", "Noto Serif Bengali", serif;
    }

    body {
      font-family: "Hind Siliguri", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", "SolaimanLipi", "Kalpurush", sans-serif;
      background: #dfe3e8;
      color: var(--ink);
    }

    #app-container {
      background-color: var(--paper);
      background-image:
        linear-gradient(to right, transparent 33px, rgba(179, 38, 30, 0.28) 33px, rgba(179, 38, 30, 0.28) 34px, transparent 34px, transparent 37px, rgba(179, 38, 30, 0.28) 37px, rgba(179, 38, 30, 0.28) 38px, transparent 38px),
        repeating-linear-gradient(to bottom, transparent 0, transparent 29px, var(--rule) 29px, var(--rule) 30px);
      box-shadow: 0 0 30px rgba(27, 42, 65, 0.14);
    }

    /* Cover: red cloth binding with a thread stitch */
    #top-chrome {
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 10px rgba(27, 42, 65, 0.18);
    }

    header {
      position: relative;
      top: auto;
      background-color: var(--binding);
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0, rgba(255,255,255,0.035) 2px, transparent 2px, transparent 4px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,0.07) 0, rgba(0,0,0,0.07) 2px, transparent 2px, transparent 4px);
      padding: 12px 16px 16px;
      box-shadow: none;
    }

    header::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 6px;
      border-top: 2px dashed rgba(227, 179, 65, 0.85);
    }

    .shop-switcher-btn {
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(227, 179, 65, 0.55);
      border-radius: 6px;
    }

    .shop-switcher-btn:hover, .shop-switcher-btn:active { background: rgba(0, 0, 0, 0.28); }

    .header-shop-name {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 400;
      color: #fff1cf;
      letter-spacing: 0.2px;
    }

    .header-cat-label { color: #f2d9a0; opacity: 1; }
    .shop-switch-arrow { color: var(--haldi); }

    .nav-btn {
      background: transparent;
      border: 1px solid rgba(227, 179, 65, 0.55);
      color: #fff1cf;
      border-radius: 6px;
    }
    .nav-btn:hover, .nav-btn:active { background: rgba(0,0,0,0.25); }

    /* Index tabs */
    .sub-navbar {
      position: relative;
      top: auto;
      background: #f2f0ea;
      border-bottom: 1px solid var(--border);
      padding: 0 4px;
      gap: 0;
    }

    .sub-nav-item {
      border-radius: 0;
      padding: 10px 2px 8px;
      font-size: 12.5px;
      color: var(--text-muted);
      border-bottom: 3px solid transparent;
    }

    .sub-nav-item.active {
      background: transparent;
      color: var(--binding);
      border-bottom-color: var(--haldi);
    }

    /* Slips of paper */
    .card, .cust-head-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 2px 3px 0 rgba(27, 42, 65, 0.07);
    }

    .card-title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 17px;
      color: var(--ink);
      padding-bottom: 8px;
      border-bottom: 3px double #cbc6b8;
    }

    /* Total outstanding: ledger total line */
    .outstanding-banner {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--border);
      border-left: 5px solid var(--binding);
      border-radius: 6px;
      box-shadow: 2px 3px 0 rgba(27, 42, 65, 0.07);
      text-align: left;
      padding: 14px 18px;
    }
    .outstanding-label { color: var(--text-muted); opacity: 1; font-size: 13px; }
    .outstanding-amount {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 36px;
      color: var(--danger);
      display: inline-block;
      border-bottom: 6px double rgba(179, 38, 30, 0.45);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .outstanding-sub { color: var(--text-muted); opacity: 1; }

    /* Customers as ledger rows */
    .customer-list { gap: 0; background: #fff; border: 1px solid var(--border); border-radius: 6px; }
    .customer-item {
      border: none;
      border-bottom: 1px dashed #cfcabc;
      border-radius: 0;
      background: transparent;
      padding: 12px 14px;
    }
    .customer-item:last-child { border-bottom: none; }
    .customer-item:hover, .customer-item:active { background: rgba(227, 179, 65, 0.14); border-color: #cfcabc; }
    .customer-name { font-weight: 600; }
    .customer-balance-val { font-family: var(--serif); font-weight: 400; font-size: 18px; }

    .cust-name-lg { font-family: var(--serif); font-weight: 400; font-size: 22px; }
    .hero-amount { font-family: var(--serif); font-weight: 400; font-size: 30px; }
    .cust-balance-hero { border-radius: 6px; }

    /* Controls */
    input[type="text"], input[type="password"], input[type="tel"], input[type="number"], select, textarea {
      border: 1.5px solid #cfcabc;
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
    }
    input:focus, select:focus, textarea:focus, .search-box input:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(227, 179, 65, 0.35);
    }
    .search-box input[type="text"], .search-box input[type="search"] { border-radius: 6px; border-color: #cfcabc; padding-left: 40px; }
    .btn:focus-visible, .nav-btn:focus-visible, .sub-nav-item:focus-visible, .pill-btn:focus-visible, .sug-pill:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid var(--haldi);
      outline-offset: 2px;
    }

    .btn { border-radius: 6px; font-weight: 600; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background-color: var(--ink); color: #fff; }
    .btn-primary:hover, .btn-primary:active { background-color: #0f1a2b; }
    .btn-baki { background-color: var(--danger); }
    .btn-joma { background-color: var(--primary); }
    .btn-outline { border-color: #bdb8a9; }
    .btn-whatsapp { background-color: #1fa855; }

    .pill-btn { border-radius: 6px; border-color: #cfcabc; }
    .pill-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .sug-pill { border-radius: 6px; background: #f6efd9; border-color: #e6d49a; color: #5a4310; }
    .sug-pill:hover, .sug-pill:active { background: var(--ink); color: #fff; border-color: var(--ink); }

    .entry-item { border-radius: 6px; background: #fff; }
    .bill-items-table th { background: #f2f0ea; }
    .notice-banner { background: #f6efd9; border-color: #e6d49a; color: #5a4310; border-radius: 6px; }
    .shift-banner { border-radius: 6px; }
    .modal-box { border-radius: 8px; }
    .badge-baki, .badge-joma { border-radius: 4px; }

    /* =====================================================
       Cash memo (the bill)
       ===================================================== */
    .receipt-container.memo {
      position: relative;
      background: #fffefb;
      color: var(--ink);
      border: 1px solid #cdc7b6;
      border-radius: 3px;
      padding: 0 18px 8px;
      font-family: "Hind Siliguri", "Noto Sans Bengali", sans-serif;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(27, 42, 65, 0.05);
    }

    .memo-scallop {
      height: 10px;
      margin: 0 -18px;
      background-image: radial-gradient(circle at 8px 0, #ffffff 0, #ffffff 5px, transparent 5.5px);
      background-size: 16px 10px;
      background-repeat: repeat-x;
    }
    .memo-scallop.bottom {
      background-image: radial-gradient(circle at 8px 10px, #ffffff 0, #ffffff 5px, transparent 5.5px);
      margin-top: 10px;
    }

    .memo-head { text-align: center; padding: 10px 0 10px; }
    .memo-icon { font-size: 22px; line-height: 1; }
    .memo .receipt-shop-name {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 24px;
      line-height: 1.25;
      margin-top: 2px;
      color: var(--binding);
    }
    .memo-sub { font-size: 12px; color: var(--text-muted); }
    .memo-title {
      display: inline-block;
      margin-top: 10px;
      padding: 2px 16px;
      font-family: var(--serif);
      font-size: 15px;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      outline: 1px solid var(--ink);
      outline-offset: 2px;
      border-radius: 1px;
    }

    .memo-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 12px;
      font-size: 12.5px;
    }
    .memo-no {
      font-family: var(--serif);
      font-size: 20px;
      color: var(--danger);
      letter-spacing: 1px;
      margin-left: 4px;
    }

    .memo-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 6px;
    }
    .memo-line .k { flex-shrink: 0; color: var(--text-muted); }
    .memo-line .v {
      flex: 1;
      border-bottom: 1px dotted #7d8794;
      padding: 0 4px 1px;
      font-weight: 600;
      min-height: 18px;
    }

    .memo-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 12.5px;
    }
    .memo-table th {
      text-align: left;
      font-weight: 600;
      padding: 5px 3px;
      border-top: 2px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      background: #f6f2e4;
    }
    .memo-table th.num, .memo-table td.num { text-align: right; }
    .memo-table td {
      padding: 6px 3px;
      vertical-align: top;
      border-bottom: 1px dotted #b8b3a4;
    }
    .memo-table td.sl { color: var(--text-muted); width: 20px; }

    .memo-bottom {
      display: flex;
      gap: 10px;
      align-items: stretch;
      margin-top: 12px;
    }
    .memo-stampcol {
      flex: 0 0 36%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .memo-stamp {
      display: inline-block;
      transform: rotate(-9deg);
      padding: 4px 12px;
      border: 3px double currentColor;
      border-radius: 4px;
      font-family: var(--serif);
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 1px;
      text-align: center;
      opacity: 0.88;
      animation: stampIn 0.32s ease-out;
    }
    .memo-stamp small { display: block; font-family: "Hind Siliguri", sans-serif; font-size: 11px; letter-spacing: 0; font-weight: 600; }
    .memo-stamp.paid { color: #1f6b4a; }
    .memo-stamp.due { color: #b3261e; }
    .memo-stamp.advance { color: #2c3f8f; }

    @keyframes stampIn {
      from { transform: rotate(-9deg) scale(1.5); opacity: 0; }
      to { transform: rotate(-9deg) scale(1); opacity: 0.88; }
    }
    @media (prefers-reduced-motion: reduce) { .memo-stamp { animation: none; } }

    .memo-totals { flex: 1; }
    .memo-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 0;
    }
    .memo-row.deduct { color: var(--danger); }
    .memo-row.paid { color: var(--primary); }
    .memo-row.grand {
      margin: 4px 0;
      padding: 5px 0;
      border-top: 1px solid var(--ink);
      border-bottom: 4px double var(--ink);
      font-family: var(--serif);
      font-size: 18px;
    }
    .memo-row.dueline { font-weight: 700; }
    .memo-prev {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed #b8b3a4;
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .memo-foot { text-align: center; margin-top: 14px; font-size: 12px; }
    .memo-note { color: var(--text-muted); font-size: 11.5px; margin-bottom: 2px; }
    .memo-sign { display: flex; justify-content: space-between; gap: 20px; margin-top: 26px; font-size: 11px; color: var(--text-muted); }
    .memo-sign span { flex: 1; border-top: 1px dotted #7d8794; padding-top: 3px; }
  
    /* Item table: keep every cell readable on phones (scrolls sideways instead of squeezing) */
    .bill-items-table { min-width: 560px; }
    .bill-items-table th { white-space: nowrap; }
    .bill-item-row input.item-name { min-width: 150px; }
    .bill-item-row input.item-qty { min-width: 64px; }
    .bill-item-row input.item-rate, .bill-item-row input.item-making, .bill-item-row input.item-total { min-width: 80px; }
    .bill-item-row select { min-width: 74px; }

    /* =====================================================
       v10: date inputs, scrollable tabs, due chips, PDF report pages
       ===================================================== */
    input[type="date"], input[type="month"] {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #cfcabc;
      border-radius: 5px;
      font-size: 15px;
      font-family: inherit;
      min-height: 42px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    input[type="date"]:focus, input[type="month"]:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(227, 179, 65, 0.35);
    }

    .sub-navbar { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .sub-navbar::-webkit-scrollbar { display: none; }
    .sub-nav-item { flex: 0 0 auto; padding-left: 10px; padding-right: 10px; white-space: nowrap; }

    .due-chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: #fef3c7;
      color: #92400e;
    }
    .due-chip.over { background: var(--danger-light); color: var(--danger); }

    /* ---- PDF report pages (A4 ratio, rendered to JPEG -> PDF) ---- */
    .rpt-page {
      width: 720px;
      height: 1019px;
      box-sizing: border-box;
      padding: 36px 40px 28px;
      background: #ffffff;
      color: #1b2a41;
      font-family: "Hind Siliguri", "Noto Sans Bengali", sans-serif;
      font-size: 13px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .rpt-preview .rpt-page { margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.18); }
    .rpt-head { text-align: center; border-bottom: 3px double #1b2a41; padding-bottom: 10px; margin-bottom: 14px; }
    .rpt-shop { font-family: var(--serif); font-size: 26px; color: #7f1d1d; line-height: 1.25; }
    .rpt-sub { font-size: 12px; color: #5f6b7a; }
    .rpt-title { display: inline-block; margin-top: 8px; padding: 2px 18px; font-family: var(--serif); font-size: 16px; border-top: 1px solid #1b2a41; border-bottom: 1px solid #1b2a41; }
    .rpt-head-sm { font-size: 12px; color: #5f6b7a; border-bottom: 1px solid #cdc7b6; padding-bottom: 6px; margin-bottom: 12px; }
    .rpt-head-sm strong { color: #1b2a41; }
    .rpt-head-sm span { float: right; }
    .rpt-body { flex: 1; min-height: 0; }
    .rpt-foot { display: flex; justify-content: space-between; font-size: 11px; color: #5f6b7a; border-top: 1px dashed #b8b3a4; padding-top: 6px; margin-top: 8px; }
    .rpt-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .rpt-tile { border: 1px solid #d5d2c8; border-left: 4px solid #7f1d1d; border-radius: 4px; padding: 8px 12px; background: #fbfbf8; }
    .rpt-tile-l { font-size: 11.5px; color: #5f6b7a; }
    .rpt-tile-v { font-family: var(--serif); font-size: 20px; line-height: 1.3; }
    .rpt-box { border: 1px solid #d5d2c8; border-radius: 4px; padding: 8px 12px; margin-bottom: 12px; background: #fbfbf8; font-size: 13px; }
    .rpt-box .k { display: inline-block; min-width: 120px; color: #5f6b7a; }
    .rpt-warn { background: #fbecea; color: #b3261e; border: 1px solid #f5b5b0; border-radius: 4px; padding: 6px 10px; margin-bottom: 10px; font-size: 12.5px; font-weight: 600; }
    .rpt-sec-title { font-family: var(--serif); font-size: 15px; margin: 8px 0 4px; height: 22px; line-height: 22px; }
    .rpt-sec-title small { font-family: "Hind Siliguri", sans-serif; font-size: 11px; color: #5f6b7a; }
    .rpt-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
    .rpt-table th { height: 26px; padding: 0 6px; background: #f2f0ea; border-top: 2px solid #1b2a41; border-bottom: 1px solid #1b2a41; text-align: left; font-weight: 600; white-space: nowrap; overflow: hidden; }
    .rpt-table td { height: 26px; padding: 0 6px; border-bottom: 1px dotted #b8b3a4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rpt-table .r { text-align: right; }
    .rpt-red { color: #b3261e; font-weight: 600; }
    .rpt-green { color: #1f6b4a; font-weight: 600; }
  </style>
</head>

  <!-- Global Modal Host for Dialogs / Receipts -->

  <script>
    /**
     * Dokan Khata (দোকানের খাতা) 2.0
     * Multi-Shop Digital Credit Ledger, Shift Register, Itemized Billing & Expenses
     */

    const STORAGE_KEY = 'dokan_khata_data';
    const SESSION_DURATION_MS = 30 * 24 * 60 * 60 * 1000; // 30 days

    // Category Metadata
    const CATEGORIES = {
      mudi: {
        id: 'mudi',
        name: 'মুদিখানা ও ডিপার্টমেন্টাল',

    // ==========================================
    // SHA-256 with Pure JS Fallback
    // ==========================================
    function jsSha256(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      let lengthProperty = 'length';
      let i, j;
      let result = '';

      let words = [];
      let asciiBitLength = ascii[lengthProperty] * 8;
      
      let hash = jsSha256.h = jsSha256.h || [];
      let k = jsSha256.k = jsSha256.k || [];
      let primeCounter = k[lengthProperty];

      let isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) {
            isComposite[i] = candidate;
          }
          hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
        }
      }
      
      words = [];
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        words[i >> 2] |= (j & 0xff) << ((3 - i % 4) * 8);
      }
      words[asciiBitLength >> 5] |= 0x80 << ((3 - (asciiBitLength >> 3) % 4) * 8);
      words[(((asciiBitLength + 64) >> 9) << 4) + 15] = asciiBitLength;
      
      hash = hash.slice(0);
      for (i = 0; i < words[lengthProperty]; i += 16) {
        let w = words.slice(i, i + 16);
        let oldHash = hash.slice(0);
        for (j = 0; j < 64; j++) {
          let w15 = w[j - 15], w2 = w[j - 2];
          let a = hash[0], e = hash[4];
          let temp1 = (hash[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & hash[5]) ^ ((~e) & hash[6]))
            + k[j]
            + (w[j] = (j < 16) ? (w[j] | 0) : (
                w[j - 16]
                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                + w[j - 7]
                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
              ) | 0
            )
          ) | 0;
          let temp2 = ((rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]))
          ) | 0;
          hash = [(temp1 + temp2) | 0, a, hash[1], hash[2], (hash[3] + temp1) | 0, hash[4], hash[5], hash[6]];
        }
        for (j = 0; j < 8; j++) {
          hash[j] = (hash[j] + oldHash[j]) | 0;
        }
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j >= 0; j--) {
          let b = (hash[i] >> (8 * j)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    async function computeSha256(str) {
      if (typeof window !== 'undefined' && window.crypto && window.crypto.subtle && window.TextEncoder) {
        try {
          const data = new TextEncoder().encode(str);
          const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {
          // fallback
        }
      }
      const utf8 = unescape(encodeURIComponent(str));
      return jsSha256(utf8);
    }

    // ==========================================
    // Vault: AES-256-GCM encryption at rest
    // ------------------------------------------
    // All ledger data is encrypted with a random 256-bit data key (DEK).
    // The DEK is never stored in the clear: it is stored wrapped twice —
    //   (1) by a key derived from the password      (PBKDF2-SHA256)
    //   (2) by a key derived from the recovery word (PBKDF2-SHA256)
    // No password or hash is stored anywhere. A wrong password simply fails
    // to decrypt (AES-GCM authentication). Changing the password only
    // re-wraps the DEK, so the data itself is not re-encrypted.
    // ==========================================
    const VAULT_KEY = 'dokan_khata_vault';
    const VAULT_VERSION = 3;
    const KDF_ITERATIONS = 600000;
    const MIN_PW_LEN = 6;
    const MIN_REC_LEN = 6;
    const SESSION_DB = 'dokan_khata_session';

    const vault = {
      initDone: false,
      initPromise: null,
      cryptoOk: false,
      mode: 'setup',        // setup | legacy | locked | unlocked | corrupt
      envelope: null,       // the object stored in localStorage
      key: null,            // CryptoKey (non-extractable) while unlocked
      plain: null,          // decrypted JSON string while unlocked
      expiresAt: 0,
      remember: true,
      legacyRaw: null,      // old unencrypted data (pre-upgrade), if any
      legacy: null,
      queue: Promise.resolve(),
      pending: 0,
      lastWritten: null
    };

    const _te = (typeof TextEncoder !== 'undefined') ? new TextEncoder() : null;
    const _td = (typeof TextDecoder !== 'undefined') ? new TextDecoder() : null;

    function bnDigits(n) {
      return String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
    }

    function b64e(buf) {
      const b = new Uint8Array(buf);
      let s = '';
      for (let i = 0; i < b.length; i += 0x8000) {
        s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
      }
      return btoa(s);
    }

    function b64d(str) {
      const s = atob(str);
      const b = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
      return b;
    }

    // Passwords are normalised so the same Bengali/Unicode text always yields the same key.
    function normPw(s) { return String(s).normalize('NFKC'); }
    function normRec(s) { return String(s).normalize('NFKC').trim().toLowerCase(); }

    async function deriveKek(secret, salt, iter) {
      const base = await crypto.subtle.importKey('raw', _te.encode(secret), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
        base,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function wrapDek(dekRaw, secret, label, iter) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const kek = await deriveKek(secret, salt, iter);
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: _te.encode(label) }, kek, dekRaw);
      return { salt: b64e(salt), iv: b64e(iv), wrap: b64e(ct) };
    }

    // Returns the raw DEK (Uint8Array) or null if the secret is wrong.
    async function unwrapDek(w, secret, label, iter) {
      try {
        const kek = await deriveKek(secret, b64d(w.salt), iter);
        const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(w.iv), additionalData: _te.encode(label) }, kek, b64d(w.wrap));
        return new Uint8Array(raw);
      } catch (e) {
        return null;
      }
    }

    function importDek(raw) {
      return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    }

    async function encryptData(key, str) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: _te.encode('data') }, key, _te.encode(str));
      return { iv: b64e(iv), ct: b64e(ct) };
    }

    async function decryptData(key, d) {
      const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(d.iv), additionalData: _te.encode('data') }, key, b64d(d.ct));
      return _td.decode(buf);
    }

    function isValidEnvelope(o) {
      const okWrap = w => !!(w && typeof w.salt === 'string' && typeof w.iv === 'string' && typeof w.wrap === 'string');
      return !!(o && typeof o === 'object' && o.v === VAULT_VERSION &&
        o.kdf && Number.isInteger(o.kdf.iter) && o.kdf.iter >= 100000 && o.kdf.iter <= 5000000 &&
        okWrap(o.pw) && okWrap(o.rec) &&
        o.data && typeof o.data.iv === 'string' && typeof o.data.ct === 'string');
    }

    // Only the shop data is encrypted; auth fields and duplicate convenience pointers are left out.
    function serializeForVault(data) {
      const copy = Object.assign({}, data);
      ['pw', 'rec', 'sessionExpiresAt', 'shop', 'customers', 'entries', 'next'].forEach(k => { delete copy[k]; });
      return JSON.stringify(copy);
    }

    function legacyToPlain(raw) {
      const o = JSON.parse(raw);
      delete o.pw; delete o.rec; delete o.sessionExpiresAt;
      return JSON.stringify(o);
    }

    // ---- "Remember on this device": the (non-extractable) key lives in IndexedDB ----
    function idbOpen() {
      return new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') { reject(new Error('no indexedDB')); return; }
        const req = indexedDB.open(SESSION_DB, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore('keys'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbOp(mode, fn) {
      const db = await idbOpen();
      try {
        return await new Promise((resolve, reject) => {
          const tx = db.transaction('keys', mode);
          const req = fn(tx.objectStore('keys'));
          tx.oncomplete = () => resolve(req ? req.result : undefined);
          tx.onerror = tx.onabort = () => reject(tx.error);
        });
      } finally {
        db.close();
      }
    }

    async function sessionSave(key, expiresAt) {
      try { await idbOp('readwrite', s => s.put({ key: key, expiresAt: expiresAt }, 'session')); } catch (e) {}
    }
    async function sessionLoad() {
      try { return (await idbOp('readonly', s => s.get('session'))) || null; } catch (e) { return null; }
    }
    async function sessionClear() {
      try { await idbOp('readwrite', s => s.delete('session')); } catch (e) {}
    }

    // ---- Lifecycle ----
    async function vaultInit() {
      vault.cryptoOk = !!(typeof window !== 'undefined' && window.crypto && window.crypto.subtle && _te && _td);
      let rawEnv = null, legacyRaw = null;
      try {
        rawEnv = localStorage.getItem(VAULT_KEY);
        legacyRaw = localStorage.getItem(STORAGE_KEY);
      } catch (e) {}

      if (rawEnv) {
        let env = null;
        try { env = JSON.parse(rawEnv); } catch (e) {}
        if (!isValidEnvelope(env)) { vault.mode = 'corrupt'; return; }
        vault.envelope = env;
        vault.mode = 'locked';
        if (vault.cryptoOk) {
          const s = await sessionLoad();
          if (s && s.key && s.expiresAt > Date.now()) {
            try {
              const plain = await decryptData(s.key, env.data);
              vault.key = s.key;
              vault.plain = plain;
              vault.lastWritten = plain;
              vault.expiresAt = s.expiresAt;
              vault.remember = true;
              vault.mode = 'unlocked';
            } catch (e) {
              await sessionClear();
            }
          }
        }
        return;
      }

      if (legacyRaw) {
        let p = null;
        try { p = JSON.parse(legacyRaw); } catch (e) { vault.mode = 'corrupt'; return; }
        if (p && typeof p === 'object' && typeof p.pw === 'string' && p.pw) {
          vault.legacyRaw = legacyRaw;
          vault.legacy = p;
          vault.mode = 'legacy';
          return;
        }
      }
      vault.mode = 'setup';
    }

    function vaultCommitEnvelope() {
      localStorage.setItem(VAULT_KEY, JSON.stringify(vault.envelope));
    }

    async function finishUnlock(raw, remember) {
      const key = await importDek(raw);
      raw.fill(0);
      const plain = await decryptData(key, vault.envelope.data);   // throws if data is damaged
      vault.key = key;
      vault.plain = plain;
      vault.lastWritten = plain;
      vault.mode = 'unlocked';
      vault.expiresAt = Date.now() + SESSION_DURATION_MS;
      vault.remember = !!remember;
      if (remember) await sessionSave(key, vault.expiresAt); else await sessionClear();
    }

    async function vaultCreate(password, recWord, plainStr, remember) {
      const iter = KDF_ITERATIONS;
      const dekRaw = crypto.getRandomValues(new Uint8Array(32));
      const key = await importDek(dekRaw);
      const [pwWrap, recWrap, data] = await Promise.all([
        wrapDek(dekRaw, normPw(password), 'wrap-pw', iter),
        wrapDek(dekRaw, normRec(recWord), 'wrap-rec', iter),
        encryptData(key, plainStr)
      ]);
      dekRaw.fill(0);
      const env = { v: VAULT_VERSION, kdf: { name: 'PBKDF2-SHA256', iter: iter }, pw: pwWrap, rec: recWrap, data: data };
      localStorage.setItem(VAULT_KEY, JSON.stringify(env));
      vault.envelope = env;
      vault.key = key;
      vault.plain = plainStr;
      vault.lastWritten = plainStr;
      vault.mode = 'unlocked';
      vault.expiresAt = Date.now() + SESSION_DURATION_MS;
      vault.remember = !!remember;
      if (remember) await sessionSave(key, vault.expiresAt); else await sessionClear();
    }

    // true = unlocked, false = wrong password. Throws if the data itself is damaged.
    async function vaultUnlock(password, remember) {
      const env = vault.envelope;
      const raw = await unwrapDek(env.pw, normPw(password), 'wrap-pw', env.kdf.iter);
      if (!raw) return false;
      await finishUnlock(raw, remember);
      return true;
    }

    // Forgot-password: recovery word opens the data key, then a new password is wrapped around it.
    async function vaultResetWithRecovery(recWord, newPw, remember) {
      const env = vault.envelope;
      const raw = await unwrapDek(env.rec, normRec(recWord), 'wrap-rec', env.kdf.iter);
      if (!raw) return false;
      env.pw = await wrapDek(raw, normPw(newPw), 'wrap-pw', env.kdf.iter);
      vaultCommitEnvelope();
      await finishUnlock(raw, remember);
      return true;
    }

    // Change password and/or recovery word (current password required).
    async function vaultChangeSecrets(curPw, newPw, newRec) {
      const env = vault.envelope;
      const raw = await unwrapDek(env.pw, normPw(curPw), 'wrap-pw', env.kdf.iter);
      if (!raw) return false;
      if (newPw) env.pw = await wrapDek(raw, normPw(newPw), 'wrap-pw', env.kdf.iter);
      if (newRec) env.rec = await wrapDek(raw, normRec(newRec), 'wrap-rec', env.kdf.iter);
      raw.fill(0);
      vaultCommitEnvelope();
      return true;
    }

    // Upgrade old plaintext data into the encrypted vault, then remove the plaintext copy.
    async function vaultUpgradeLegacy(newPw, recWord, remember) {
      const plain = legacyToPlain(vault.legacyRaw);
      try {
        await vaultCreate(newPw, recWord, plain, remember);
        const stored = JSON.parse(localStorage.getItem(VAULT_KEY));
        const back = await decryptData(vault.key, stored.data);
        if (back !== plain) throw new Error('যাচাই ব্যর্থ হয়েছে');
      } catch (err) {
        try { localStorage.removeItem(VAULT_KEY); } catch (e) {}
        vault.key = null; vault.plain = null; vault.envelope = null; vault.mode = 'legacy';
        throw err;
      }
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      vault.legacyRaw = null;
      vault.legacy = null;
    }

    async function vaultLock() {
      try { await vault.queue; } catch (e) {}
      vault.key = null;
      vault.plain = null;
      vault.lastWritten = null;
      vault.expiresAt = 0;
      if (vault.envelope) vault.mode = 'locked';
      appData = null;
      await sessionClear();
    }

    function vaultCheckExpiry() {
      if (vault.mode === 'unlocked' && Date.now() >= vault.expiresAt) {
        vault.key = null;
        vault.plain = null;
        vault.lastWritten = null;
        vault.mode = 'locked';
        sessionClear();
      }
    }

    // Called by saveData(): the plaintext snapshot is kept in memory immediately and the
    // encrypted copy is written right behind it (writes are serialised and coalesced).
    function vaultPersist(plainStr) {
      if (!vault.key) throw new Error('খাতা লক করা আছে');
      vault.plain = plainStr;
      vault.pending++;
      vault.queue = vault.queue.then(async () => {
        const key = vault.key;
        const snapshot = vault.plain;
        if (!key || snapshot === vault.lastWritten) return;
        vault.envelope.data = await encryptData(key, snapshot);
        vaultCommitEnvelope();
        vault.lastWritten = snapshot;
      }).catch(err => {
        console.error('Vault write failed:', err);
        alert('তথ্য সংরক্ষণ করতে ব্যর্থ হয়েছে! মেমোরি পূর্ণ হতে পারে। (' + (err && err.message ? err.message : err) + ')');
      }).then(() => { vault.pending--; });
    }

    function isLoggedIn() {
      return vault.mode === 'unlocked' && !!vault.key && Date.now() < vault.expiresAt;
    }

    window.addEventListener('beforeunload', function (e) {
      if (vault.pending > 0) { e.preventDefault(); e.returnValue = ''; }
    });

    // ==========================================
    // Storage, Multi-Shop & State Management
    // ==========================================
    function loadData() {
      try {
        const raw = vault.plain;
        if (!raw) return null;
        let parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          // Auto-migration from V1 (Single Shop) to V2 (Multi-Shop)
          if (!parsed.shops || !Array.isArray(parsed.shops)) {
            const initialShop = {
              id: 1,
              name: parsed.shop || 'দোকানের খাতা',
              category: 'general',
              phone: '',
              address: '',
              next: typeof parsed.next === 'number' ? parsed.next : 1,
              customers: Array.isArray(parsed.customers) ? parsed.customers : [],
              entries: Array.isArray(parsed.entries) ? parsed.entries : [],
              expenses: [],
              shifts: [],
              currentShift: null
            };
            parsed.shops = [initialShop];
            parsed.activeShopId = 1;
            parsed.nextShopId = 2;
            parsed.version = 2;
            try {
              vaultPersist(serializeForVault(parsed));
            } catch (e) {}
          }

          // Ensure active shop exists
          if (!parsed.shops.find(s => s.id === parsed.activeShopId)) {
            parsed.activeShopId = parsed.shops[0] ? parsed.shops[0].id : 1;
          }

          // Ensure arrays on each shop
          for (const s of parsed.shops) {
            s.customers = Array.isArray(s.customers) ? s.customers : [];
            s.entries = Array.isArray(s.entries) ? s.entries : [];
            s.expenses = Array.isArray(s.expenses) ? s.expenses : [];
            s.shifts = Array.isArray(s.shifts) ? s.shifts : [];
            s.bills = Array.isArray(s.bills) ? s.bills : [];
            s.inventory = Array.isArray(s.inventory) ? s.inventory : [];
            s.next = typeof s.next === 'number' ? s.next : 1;
            s.category = s.category || 'general';
          }

          // Bind convenience pointers to active shop for backward compatibility
          bindActiveShopPointers(parsed);
          return parsed;
        }
        return null;
      } catch (err) {
        console.error('Error reading data:', err);
        alert('তথ্য পড়তে ব্যর্থ হয়েছে: ' + err.message);
        return null;
      }
    }

    function bindActiveShopPointers(data) {
      if (!data || !data.shops) return;
      const active = data.shops.find(s => s.id === data.activeShopId) || data.shops[0];
      if (active) {
        data.shop = active.name;
        data.customers = active.customers;
        data.entries = active.entries;
        data.next = active.next;
      }
    }

    function saveData() {
      try {
        if (appData) {
          const active = getActiveShop();
          if (active) {
            // Keep appData and active shop bidirectional sync
            if (appData.customers && appData.customers !== active.customers) {
              active.customers = appData.customers;
            }
            if (appData.entries && appData.entries !== active.entries) {
              active.entries = appData.entries;
            }
            if (appData.shop && appData.shop !== active.name) {
              active.name = appData.shop;
            }
            if (typeof active.next === 'number') {
              appData.next = active.next;
            }
            bindActiveShopPointers(appData);
          }
        }
        vaultPersist(serializeForVault(appData));
        return true;
      } catch (err) {
        console.error('Error saving data:', err);
        alert('তথ্য সংরক্ষণ করতে ব্যর্থ হয়েছে! মেমোরি পূর্ণ হতে পারে। (' + err.message + ')');
        return false;
      }
    }

    function getActiveShop() {
      if (!appData || !appData.shops || appData.shops.length === 0) return null;
      return appData.shops.find(s => s.id === appData.activeShopId) || appData.shops[0];
    }

    function switchShop(shopId) {
      if (!appData || !appData.shops) return;
      const target = appData.shops.find(s => s.id === shopId);
      if (target) {
        appData.activeShopId = target.id;
        bindActiveShopPointers(appData);
        saveData();
        closeModal();
        renderApp();
      }
    }

    // ==========================================
    // Helpers: HTML Escaping, Money, Dates, CSV
    // ==========================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatMoney(paise) {
      const p = Math.round(Number(paise) || 0);
      const absRupees = (Math.abs(p) / 100).toFixed(2);
      return '₹' + absRupees;
    }

    const PAY_MODES = {
      cash: { icon: '💵', label: 'নগদ (Cash)', short: 'নগদ' },
      upi:  { icon: '📱', label: 'UPI', short: 'UPI' },
      card: { icon: '💳', label: 'কার্ড (Card)', short: 'কার্ড' }
    };
    function payModeKey(m) { return PAY_MODES[m] ? m : 'cash'; }
    function payModeShort(m) { return PAY_MODES[payModeKey(m)].short; }
    function payModeSelectHtml(id, label) {
      return `<div class="form-group"><label for="${id}">${label}</label><select id="${id}">${Object.keys(PAY_MODES).map(k => `<option value="${k}">${PAY_MODES[k].icon} ${PAY_MODES[k].label}</option>`).join('')}</select></div>`;
    }

    function formatDateBn(dateStr) {
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleString('bn-IN', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return dateStr;
      }
    }

    function formatDateForFilename(d = new Date()) {
      return d.toISOString().slice(0, 10);
    }

    function getCustomerBalance(cid) {
      const shop = getActiveShop();
      if (!shop || !shop.entries) return 0;
      let balance = 0;
      for (const e of shop.entries) {
        if (String(e.cid) === String(cid)) {
          if (e.kind === 'baki') {
            balance += e.a;
          } else if (e.kind === 'joma') {
            balance -= e.a;
          }
        }
      }
      return balance;
    }

    function getTotalOutstanding() {
      const shop = getActiveShop();
      if (!shop || !shop.customers) return 0;
      let total = 0;
      for (const c of shop.customers) {
        const b = getCustomerBalance(c.id);
        if (b > 0) total += b;
      }
      return total;
    }

    function normalizePhone(phone) {
      if (!phone) return null;
      let clean = String(phone).replace(/\D/g, '');
      if (clean.length === 11 && clean.startsWith('0')) {
        clean = clean.slice(1);
      }
      if (clean.length === 10) {
        clean = '91' + clean;
      }
      if (/^91\d{10}$/.test(clean)) {
        return clean;
      }
      return null;
    }

    function escapeCsvCell(val) {
      let s = (val === null || val === undefined) ? '' : String(val);
      if (/^[=+\-@]/.test(s)) {
        s = "'" + s;
      }
      return '"' + s.replace(/"/g, '""') + '"';
    }

    function downloadCsv(filename, rows) {
      const csv = '\uFEFF' + rows.map(r => r.map(escapeCsvCell).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Modal Manager
    function openModal(htmlContent) {
      const host = document.getElementById('modal-host');
      host.innerHTML = `<div class="modal-overlay" id="modal-bg" onclick="handleModalBgClick(event)">${htmlContent}</div>`;
      host.style.display = 'block';
    }

    function closeModal() {
      const host = document.getElementById('modal-host');
      host.innerHTML = '';
      host.style.display = 'none';
    }

    function handleModalBgClick(e) {
      if (e.target && e.target.id === 'modal-bg') {
        closeModal();
      }
    }

    // ==========================================
    // Backup & Restore (Multi-Shop Support)
    // ==========================================
    function downloadBackup() {
      if (!vault.key || !vault.envelope) return;
      // Wait for any in-flight encrypted write so the file holds the latest data.
      vault.queue.then(function () {
        const out = Object.assign({ format: 'dokan_khata_encrypted_backup' }, vault.envelope);
        const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dokan_khata_backup_${formatDateForFilename()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    function validateBackupData(obj) {
      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
      if (typeof obj.pw !== 'string' || !obj.pw.trim()) return false;

      // Check V2 format (shops array)
      if (Array.isArray(obj.shops) && obj.shops.length > 0) {
        for (const s of obj.shops) {
          if (!s || typeof s !== 'object') return false;
          if (typeof s.name !== 'string' || !s.name.trim()) return false;
          if (!Array.isArray(s.customers) || !Array.isArray(s.entries)) return false;
        }
        return true;
      }

      // Check V1 legacy format
      if (typeof obj.shop !== 'string' || !obj.shop.trim()) return false;
      if (!Array.isArray(obj.customers)) return false;
      if (!Array.isArray(obj.entries)) return false;
      for (const c of obj.customers) {
        if (!c || typeof c !== 'object') return false;
        if (typeof c.id === 'undefined' || typeof c.name !== 'string') return false;
      }
      for (const ent of obj.entries) {
        if (!ent || typeof ent !== 'object') return false;
        if (typeof ent.id === 'undefined' || typeof ent.cid === 'undefined') return false;
        if (ent.kind !== 'baki' && ent.kind !== 'joma') return false;
        if (typeof ent.a !== 'number' || isNaN(ent.a)) return false;
      }
      return true;
    }

    // Generic small prompt (password etc.) built on the existing modal host.
    function askFields(title, intro, fields) {
      return new Promise(resolve => {
        openModal(`
          <div class="modal-box">
            <div class="modal-box-header">
              <div class="modal-box-title">${escapeHtml(title)}</div>
              <button type="button" id="ask-x" style="background: none; border: none; font-size: 18px; cursor: pointer;">✕</button>
            </div>
            <div class="modal-box-body">
              <p class="help-text mb-3">${escapeHtml(intro)}</p>
              <form id="ask-form" novalidate>
                ${fields.map(f => `
                  <div class="form-group">
                    <label for="ask-${f.id}">${escapeHtml(f.label)}</label>
                    <input type="${f.type || 'password'}" id="ask-${f.id}" autocomplete="off">
                  </div>
                `).join('')}
                <button type="submit" class="btn btn-primary mt-2">ঠিক আছে</button>
                <button type="button" class="btn btn-outline mt-2" id="ask-cancel">বাতিল</button>
              </form>
            </div>
          </div>
        `);
        const first = document.getElementById('ask-' + fields[0].id);
        if (first) first.focus();
        document.getElementById('ask-form').onsubmit = function (e) {
          e.preventDefault();
          const vals = {};
          fields.forEach(f => { vals[f.id] = document.getElementById('ask-' + f.id).value; });
          closeModal();
          resolve(vals);
        };
        const cancel = () => { closeModal(); resolve(null); };
        document.getElementById('ask-cancel').onclick = cancel;
        document.getElementById('ask-x').onclick = cancel;
      });
    }

    function legacyBackupToData(obj) {
      if (Array.isArray(obj.shops) && obj.shops.length > 0) {
        return {
          version: 2,
          activeShopId: obj.activeShopId || obj.shops[0].id,
          nextShopId: typeof obj.nextShopId === 'number' ? obj.nextShopId : (Math.max(...obj.shops.map(s => s.id)) + 1),
          shops: obj.shops
        };
      }
      const nextId = typeof obj.next === 'number'
        ? obj.next
        : Math.max(1, ...obj.customers.map(c => Number(c.id) || 0), ...obj.entries.map(e => Number(e.id) || 0)) + 1;
      return {
        version: 2,
        activeShopId: 1,
        nextShopId: 2,
        shops: [{
          id: 1,
          name: obj.shop.trim(),
          category: 'general',
          phone: '',
          address: '',
          next: nextId,
          customers: obj.customers,
          entries: obj.entries,
          expenses: [],
          shifts: [],
          currentShift: null
        }]
      };
    }

    const RESTORE_CONFIRM_MSG = 'আপনি কি নিশ্চিত এই ব্যাকআপ ফাইলটি রিস্টোর করতে চান? বর্তমান সমস্ত তথ্য প্রতিস্থাপিত হবে।';

    // New-format (encrypted) backup: opened with the backup's password or recovery word.
    async function restoreEncryptedBackup(obj) {

      const ans = await askFields(
        '🔐 ব্যাকআপ খুলুন',

        [{ id: 'secret', label: 'পাসওয়ার্ড / পুনরুদ্ধার শব্দ', type: 'password' }]
      );
      if (!ans || !ans.secret) return false;

      let raw = await unwrapDek(obj.pw, normPw(ans.secret), 'wrap-pw', obj.kdf.iter);
      if (!raw) raw = await unwrapDek(obj.rec, normRec(ans.secret), 'wrap-rec', obj.kdf.iter);
      if (!raw) { alert('ভুল পাসওয়ার্ড! ব্যাকআপ খোলা যায়নি।'); return false; }

      const key = await importDek(raw);
      raw.fill(0);
      let plain;
      try {
        plain = await decryptData(key, obj.data);
        JSON.parse(plain);
      } catch (e) {
        alert('ব্যাকআপ ফাইলটি নষ্ট বা অসম্পূর্ণ!');
        return false;
      }

      try { await vault.queue; } catch (e) {}
      const env = { v: obj.v, kdf: obj.kdf, pw: obj.pw, rec: obj.rec, data: obj.data };
      localStorage.setItem(VAULT_KEY, JSON.stringify(env));
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      vault.envelope = env;
      vault.key = key;
      vault.plain = plain;
      vault.lastWritten = plain;
      vault.mode = 'unlocked';
      vault.legacyRaw = null;
      vault.legacy = null;
      vault.expiresAt = Date.now() + SESSION_DURATION_MS;
      if (vault.remember !== false) await sessionSave(key, vault.expiresAt); else await sessionClear();

      alert('ব্যাকআপ সফলভাবে রিস্টোর করা হয়েছে!\nএখন থেকে এই ব্যাকআপের পাসওয়ার্ডই আপনার খাতার পাসওয়ার্ড।');
      window.location.hash = '#/';
      renderApp();
      return true;
    }

    // Old-format (plain JSON, SHA-256 password hash) backup.
    async function restoreLegacyBackup(obj) {
      if (!confirm(RESTORE_CONFIRM_MSG)) return false;
      const ans = await askFields(
        '🔐 পুরনো ব্যাকআপ',
        'এটি পুরনো (এনক্রিপ্ট না করা) ফরম্যাটের ব্যাকআপ। যাচাইয়ের জন্য ব্যাকআপের পাসওয়ার্ড দিন।',
        [{ id: 'secret', label: 'ব্যাকআপের পাসওয়ার্ড', type: 'password' }]
      );
      if (!ans || !ans.secret) return false;
      if ((await computeSha256(ans.secret)) !== obj.pw) { alert('ভুল পাসওয়ার্ড!'); return false; }

      const data = legacyBackupToData(obj);

      if (vault.mode === 'unlocked') {
        // Keep the current password; only the ledger data is replaced.
        appData = data;
        bindActiveShopPointers(appData);
        if (!saveData()) return false;
        try { await vault.queue; } catch (e) {}
      } else {
        const f = await askFields(
          '🔒 নতুন পাসওয়ার্ড সেট করুন',
          'এখন থেকে খাতা এনক্রিপ্টেড থাকবে। নতুন পাসওয়ার্ড ও পুনরুদ্ধার শব্দ দিন।',
          [
            { id: 'pw', label: 'নতুন পাসওয়ার্ড (কমপক্ষে ' + bnDigits(MIN_PW_LEN) + ' অক্ষর)', type: 'password' },
            { id: 'pw2', label: 'পাসওয়ার্ড নিশ্চিত করুন', type: 'password' },
            { id: 'rec', label: 'পুনরুদ্ধার শব্দ (কমপক্ষে ' + bnDigits(MIN_REC_LEN) + ' অক্ষর)', type: 'text' }
          ]
        );
        if (!f) return false;
        if (f.pw.length < MIN_PW_LEN) { alert('পাসওয়ার্ড কমপক্ষে ' + bnDigits(MIN_PW_LEN) + ' অক্ষরের হতে হবে!'); return false; }
        if (f.pw !== f.pw2) { alert('পাসওয়ার্ড নিশ্চিতকরণ মেলেনি!'); return false; }
        if (f.rec.trim().length < MIN_REC_LEN) { alert('পুনরুদ্ধার শব্দ কমপক্ষে ' + bnDigits(MIN_REC_LEN) + ' অক্ষরের হতে হবে!'); return false; }
        if (normRec(f.pw) === normRec(f.rec)) { alert('পুনরুদ্ধার শব্দ পাসওয়ার্ডের থেকে আলাদা হতে হবে!'); return false; }
        await vaultCreate(f.pw, f.rec, serializeForVault(data), vault.remember !== false);
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        vault.legacyRaw = null;
        vault.legacy = null;
      }

      alert('ব্যাকআপ সফলভাবে রিস্টোর করা হয়েছে!');
      window.location.hash = '#/';
      renderApp();
      return true;
    }

    async function restoreFromJsonObject(obj) {
      try {
        if (!vault.cryptoOk) {
          alert('এই ব্রাউজারে এনক্রিপশন সাপোর্ট নেই, তাই রিস্টোর করা যাচ্ছে না।');
          return false;
        }
        if (isValidEnvelope(obj)) return await restoreEncryptedBackup(obj);
        if (validateBackupData(obj)) return await restoreLegacyBackup(obj);
        alert('ব্যাকআপ ফাইলের গঠন সঠিক নয়! অনুগ্রহ করে সঠিক ব্যাকআপ ফাইল নির্বাচন করুন।');
      } catch (err) {
        console.error(err);
        alert('রিস্টোর করতে সমস্যা হয়েছে: ' + (err && err.message ? err.message : err));
      }
      return false;
    }

    function deleteShop(shopId) {
      if (appData.shops.length <= 1) {
        alert('অন্তত একটি দোকান থাকা আবশ্যক!');
        return;
      }
      const target = appData.shops.find(s => s.id === shopId);
      if (!target) return;

      if (confirm(`আপনি কি নিশ্চিত? "${target.name}" দোকানের সমস্ত বাকি, বিল ও হিসাব চিরতরে মুছে যাবে!`)) {
        appData.shops = appData.shops.filter(s => s.id !== shopId);
        if (appData.activeShopId === shopId) {
          appData.activeShopId = appData.shops[0].id;
        }
        bindActiveShopPointers(appData);
        saveData();
        showShopSwitcherModal();
      }
    }

    async function runBusy(btn, label, fn) {
      const old = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = label; }
      try {
        return await fn();
      } catch (err) {
        console.error(err);
        alert('সমস্যা হয়েছে: ' + (err && err.message ? err.message : err));
        return null;
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = old; }
      }
    }

    function rememberHtml(id) {
      return `
        <label style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;margin:8px 0 0;">
          <input type="checkbox" id="${id}" checked style="width:auto;margin:0;">

        </label>

      `;
    }

    function wireRestore(btnId, inputId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (!input || !btn) return;
      btn.onclick = () => input.click();
      input.onchange = function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (evt) {
          let obj;
          try {
            obj = JSON.parse(evt.target.result);
          } catch (err) {
            alert('ফাইলটি পড়তে সমস্যা হয়েছে: ' + err.message);
            return;
          }
          restoreFromJsonObject(obj);
        };
        reader.readAsText(file);
        input.value = '';
      };
    }

    function downloadLegacyRawBackup() {
      if (!vault.legacyRaw) return;
      const blob = new Blob([vault.legacyRaw], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dokan_khata_old_backup_${formatDateForFilename()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function renderHomeView() {
      const shop = getActiveShop();
      const main = document.getElementById('app-main');
      const totalOutstanding = getTotalOutstanding();
      const shift = shop.currentShift;

      // Calculate shift stats if open
      let shiftSales = 0;
      let shiftCashIn = 0;
      let shiftCreditGiven = 0;
      let shiftExpenses = 0;

      if (shift) {
        const openTime = new Date(shift.openedAt).getTime();
        for (const e of shop.entries) {
          const entryTime = new Date(e.at).getTime();
          if (entryTime >= openTime) {
            if (e.kind === 'baki') {
              shiftCreditGiven += e.a;
              shiftSales += e.a;
            } else if (e.kind === 'joma') {
              if (payModeKey(e.mode) === 'cash') shiftCashIn += e.a;
            }
          }
        }
        const nbCash = normalBillCashSince(shop, openTime);
        shiftCashIn += nbCash;
        shiftSales += nbCash;
        for (const exp of shop.expenses) {
          const expTime = new Date(exp.at).getTime();
          if (expTime >= openTime) {
            shiftExpenses += exp.a;
          }
        }
      }

      const shiftDigital = shift ? digitalCollectedSince(shop, new Date(shift.openedAt).getTime()) : 0;

      const expectedDrawerCash = shift ? ((shift.openingCash || 0) + shiftCashIn - shiftExpenses) : 0;
